  <script>
    document.documentElement.classList.add("mobile-splash-pending");
  </script>
  <style>
    html.mobile-splash-pending { background: #000; }
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FQM5TN868P"></script>
  <script>

    gtag('config', 'G-FQM5TN868P');

  <style>
    :root {
      --green: #39FF14;
      --green-dark: #1db954;
      --ink: #ffffff;
      --silver: #b3b3b3;
      --near-white: #fdfdfd;
      --bg: #121212;
      --surface: #181818;
      --surface-2: #1f1f1f;
      --surface-3: #252525;
      --border: #4d4d4d;
      --red: #f3727f;
    }

    * { box-sizing: border-box; }

    .splash-overlay { display: none; }

    @media (min-width: 0) {
      html.mobile-splash-pending,
      html.mobile-splash-pending body {
        overflow: hidden;
        overscroll-behavior: none;
      }

      html.mobile-splash-pending .app {
        visibility: hidden;
      }

      html.mobile-splash-exit .app {
        visibility: visible;
      }

      .splash-overlay {
        position: fixed;
        z-index: 10000;
        inset: 0;
        display: grid;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        padding:
          max(20px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        place-items: center;
        overflow: hidden;
        color: #fff;
        background: #000;
        pointer-events: auto;
        transition: opacity 250ms ease;
      }

      html.mobile-splash-exit .splash-overlay {
        opacity: 0;
        pointer-events: none;
      }

      .splash-logo {
        width: min(82vw, 380px);
        aspect-ratio: 1 / 1.03;
        transform: translateY(calc((env(safe-area-inset-top) - env(safe-area-inset-bottom)) / 2));
      }

      .splash-logo svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .splash-red-light {
        opacity: 1;
        transform: scale(1);
        transform-origin: center;
        transform-box: fill-box;
        transition: opacity 120ms linear, transform 120ms ease;
      }

      .splash-runner {
        opacity: 0;
        transform: translateY(6px) scale(.84);
        transform-origin: center;
        transform-box: fill-box;
        transition: opacity 520ms ease-out, transform 600ms cubic-bezier(.2, .75, .25, 1);
      }

      .splash-stop {
        transform: translateX(82px);
        transition: transform 220ms cubic-bezier(.15, .85, .25, 1);
      }

      .splash-less {
        opacity: 0;
        transform: translate(-6px, 3px);
        transition: opacity 520ms ease-out 100ms, transform 600ms cubic-bezier(.2, .75, .25, 1) 100ms;
      }

      html.mobile-splash-flicker .splash-red-light {
        animation: splashRedFlicker 400ms steps(1, end) both;
      }

      @keyframes splashRedFlicker {
        0% { opacity: 1; transform: translate(0, 0) scale(1); }
        14% { opacity: .28; transform: translate(1px, 0) scale(.98); }
        28% { opacity: .88; transform: translate(-1px, 1px) scale(1); }
        43% { opacity: .16; transform: translate(1px, -1px) scale(.96); }
        58% { opacity: .7; transform: translate(0, 1px) scale(.99); }
        72% { opacity: .08; transform: translate(-1px, 0) scale(.94); }
        87% { opacity: .42; transform: translate(1px, 0) scale(.97); }
        100% { opacity: .14; transform: translate(0, 0) scale(.92); }
      }

      html.mobile-splash-transition .splash-red-light {
        opacity: 0;
        transform: scale(.9);
      }

      html.mobile-splash-transition .splash-runner,
      html.mobile-splash-transition .splash-less {
        opacity: 1;
        transform: none;
      }

      html.mobile-splash-transition .splash-stop {
        transform: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-overlay { transition-duration: 150ms; }
        .splash-red-light,
        .splash-runner,
        .splash-stop,
        .splash-less { transition-duration: 150ms; }

        html.mobile-splash-flicker .splash-red-light { animation: none; }
      }
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: "Pretendard", "Segoe UI", -apple-system, Arial, sans-serif;
    }

    body {
      background: #171717;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(340px, 420px) minmax(0, 1fr);
    }

    .panel {
      z-index: 10;
      padding: 28px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-y: auto;
    }

    h1 {
      margin: 0;
      color: var(--near-white);
      font-size: clamp(30px, 4vw, 40px);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .brand-title {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 1.25em;
      height: 1.25em;
      flex: 0 0 auto;
    }

    p {
      margin: 8px 0 0;
      color: var(--silver);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.43;
    }

    form {
      display: grid;
      gap: 14px;
    }

    .top-control-panel {
      display: grid;
      gap: 14px;
    }

    .place-actions {
      display: none;
    }

    #mobileDistanceSelect {
      display: none;
    }

    .swap-places-row {
      display: flex;
      justify-content: center;
      margin-block: -8px;
    }

    .swap-places-button {
      width: 34px;
      min-height: 22px;
      padding: 0;
      color: var(--green);
      background: transparent;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
      transform: translateX(-34px);
    }

    .swap-places-button:hover {
      color: var(--green);
      background: var(--surface-2);
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--near-white);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.2;
    }

    input {
      width: 100%;
      min-height: 42px;
      border: 0;
      border-radius: 500px;
      padding: 0 12px;
      color: var(--ink);
      background: var(--surface-2);
      font: inherit;
      outline: none;
      transition: border-color .33s, box-shadow .25s;
    }

    input::placeholder { color: var(--silver); }

    input:focus {
      box-shadow: rgb(124, 124, 124) 0 0 0 1px inset;
    }

    .distance-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .distance-options input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .distance-options span {
      display: grid;
      min-height: 40px;
      place-items: center;
      border: 0;
      border-radius: 9999px;
      color: var(--silver);
      background: var(--surface-2);
      font-weight: 500;
      cursor: pointer;
      transition: border-color .33s, background-color .33s, color .33s;
    }

    .pick-label-short {
      display: none;
    }

    .distance-options input:checked + span {
      color: #000;
      background: var(--green);
    }

    .button-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(132px, .78fr);
      gap: 10px;
      align-items: center;
    }

    #makeRoute {
      min-height: 68px;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .route-control-stack {
      display: grid;
      gap: 8px;
    }

    #findNew {
      width: 100%;
      min-height: 44px;
      color: var(--ink);
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 13px;
      letter-spacing: 1px;
    }

    .history-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    #prevRoute,
    #nextRoute {
      width: 100%;
      min-height: 40px;
      padding: 0;
      border-radius: 9999px;
      font-size: 22px;
      line-height: 1;
      letter-spacing: 0;
      align-self: center;
    }

    #prevRoute:disabled,
    #nextRoute:disabled,
    #findNew:disabled {
      opacity: .38;
      cursor: not-allowed;
    }

    .watch-button {
      width: 100%;
      min-height: 44px;
      color: var(--ink);
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 13px;
      letter-spacing: 1.1px;
    }

    .watch-button[hidden] { display: none; }

    .bottom-sheet { display: contents; }
    .bottom-sheet-handle { display: none; }
    .route-position { display: none; }

    .recent-search {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--silver);
      font-size: 13px;
      line-height: 1.4;
    }

    .recent-search strong {
      flex: 0 0 auto;
      color: var(--near-white);
      font-size: 14px;
      font-weight: 500;
    }

    .recent-search-list {
      min-width: 0;
      display: flex;
      flex: 1 1 auto;
      flex-wrap: wrap;
      gap: 6px;
    }

    .recent-search-item {
      width: auto;
      min-height: 28px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 9999px;
      color: var(--silver);
      background: transparent;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: 0;
      text-align: left;
      text-transform: none;
    }

    .recent-search-item:hover {
      color: var(--ink);
      background: var(--surface-3);
    }

    button {
      min-height: 40px;
      border: 0;
      border-radius: 9999px;
      padding: 4px 16px;
      color: #000;
      background: var(--green);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      cursor: pointer;
      transition: border-color .33s, background-color .33s, color .33s, box-shadow .25s;
    }

    button:hover { background: var(--green-dark); }
    button:focus-visible { box-shadow: rgb(124,124,124) 0 0 0 1px inset; }
    button:disabled { opacity: .55; cursor: wait; }

    button.secondary {
      color: var(--ink);
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    button.secondary:hover {
      background: var(--surface-3);
    }

    .result {
      display: grid;
      gap: 14px;
      padding-top: 22px;
      border-top: 1px solid rgba(179, 179, 179, .18);
    }

    .status {
      min-height: 42px;
      color: var(--silver);
      font-size: 14px;
      line-height: 1.43;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      min-width: 0;
      padding: 12px 0;
      padding: 14px;
      border-radius: 8px;
      background: var(--surface);
      box-shadow: rgba(0,0,0,.3) 0 8px 8px;
    }

    .metric b {
      display: block;
      color: var(--near-white);
      font-size: 22px;
      font-weight: 500;
      line-height: 1.18;
    }

    .metric span {
      display: block;
      margin-top: 4px;
      color: var(--silver);
      font-size: 12px;
      line-height: 1.25;
    }

    .note {
      margin: 0;
      color: var(--silver);
      font-size: 13px;
      line-height: 1.5;
    }

    .map-area {
      position: relative;
      min-width: 0;
      min-height: 100%;
      background: var(--surface);
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-badge {
      position: absolute;
      z-index: 3;
      left: 18px;
      bottom: 18px;
      max-width: min(560px, calc(100% - 36px));
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--ink);
      background: rgba(24, 24, 24, .9);
      box-shadow: rgba(0,0,0,.5) 0 8px 24px;
      backdrop-filter: blur(10px);
      font-size: 13px;
      line-height: 1.45;
    }

    .current-location-button {
      position: absolute;
      z-index: 8;
      top: 18px;
      right: 18px;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 9999px;
      color: var(--ink);
      background: rgba(24, 24, 24, .92);
      box-shadow: rgba(0, 0, 0, .36) 0 6px 14px;
      font-size: 13px;
      letter-spacing: 0;
      text-transform: none;
      backdrop-filter: blur(10px);
    }

    .current-location-button:hover,
    .current-location-button.active {
      color: #000;
      background: var(--green);
    }

    .current-location-dot {
      width: 20px;
      height: 20px;
      border: 4px solid #fff;
      border-radius: 50%;
      background: #4285f4;
      box-shadow: 0 0 0 7px rgba(66, 133, 244, .24), rgba(0, 0, 0, .4) 0 3px 8px;
    }

    .map-fullscreen-toggle,
    .map-fullscreen-close {
      display: none;
    }

    .pin {
      width: 30px;
      height: 30px;
      border: 3px solid #fff;
      border-radius: 50% 50% 50% 0;
      background: var(--red);
      transform: rotate(-45deg);
    }

    .pin::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 9px;
      left: 8px;
      top: 8px;
      border-radius: 50%;
      background: #fff;
    }

    .route-arrow {
      position: relative;
      width: 14px;
      height: 14px;
      pointer-events: none;
      transform-origin: 50% 50%;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .22));
    }

    .route-arrow::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 2px;
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 9px solid rgba(255, 255, 255, .88);
    }

    @media (min-width: 0) {
      .button-row,
      .distance-options { grid-template-columns: 1fr; }

      .metric-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
    }

    @media (min-width: 0) {
      html,
      body {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
      }

      .app {
        height: auto;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      .panel {
        display: contents;
      }

      .panel > section {
        order: 0;
        padding: max(22px, env(safe-area-inset-top)) 22px 18px;
      }

      #routeForm {
        display: contents;
      }

      #routeForm > .place-field,
      #routeForm > .map-pick-row,
      #routeForm > .recent-search,
      #routeForm > label,
      #routeForm > .button-row,
      #routeForm > #sendWatch,
      .status,
      .metric-grid,
      .note {
        padding-inline: 22px;
      }

      #routeForm > label {
        gap: 10px;
      }

      #routeForm > .place-field,
      #routeForm > .map-pick-row,
      #routeForm > .recent-search,
      #routeForm > label:nth-of-type(4),
      #routeForm > .loop-toggle,
      #routeForm > .button-row,
      .status,
      .note {
        margin-bottom: 16px;
      }

      .result {
        gap: 18px;
      }

      #routeForm > .place-field:nth-of-type(1) { order: 1; }
      #routeForm > .swap-places-row { order: 2; margin: -10px 0 6px; }
      #routeForm > .place-field:nth-of-type(2) { order: 3; }
      #routeForm > .map-pick-row { display: none; }
      #routeForm > .loop-toggle { order: 4; }
      #routeForm > .recent-search { order: 5; }
      #routeForm > label:nth-of-type(4) { order: 6; }
      .result { display: contents; }
      .status { order: 7; padding-top: 6px; }

      .map-area {
        order: 8;
        width: 100%;
        min-height: 0;
        height: clamp(300px, 42vh, 400px);
        padding: 0 22px 22px;
      }

      .button-row {
        order: 9;
        grid-template-columns: 1fr;
        padding-inline: 22px;
      }

      .route-control-stack {
        grid-template-columns: minmax(0, 7fr) minmax(0, 3fr);
        gap: 8px;
        align-items: stretch;
      }

      .route-control-stack .history-nav {
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }

      .route-control-stack #prevRoute,
      .route-control-stack #nextRoute {
        min-height: 44px;
      }

      #sendWatch {
        order: 10;
        margin-inline: 22px;
      }

      .metric-grid {
        order: 11;
        grid-template-columns: 1fr;
      }

      .note {
        order: 12;
      }

      .place-input-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
      }

      .mobile-map-pick {
        display: inline-grid;
        min-height: 42px;
        padding-inline: 12px;
        place-items: center;
        white-space: normal;
        font-size: 12px;
        line-height: 1.2;
        letter-spacing: 0;
        text-transform: none;
      }

      .map-badge {
        left: 12px;
        right: 12px;
        bottom: 12px;
        max-width: none;
        font-size: 12px;
      }

      .distance-options {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
      }

      .distance-options label {
        min-width: 0;
      }

      .distance-options span {
        min-height: 36px;
        padding: 0 4px;
        font-size: 14px;
        white-space: nowrap;
      }

      .loop-toggle {
        width: calc(100% - 44px);
        max-width: calc(100% - 44px);
        box-sizing: border-box;
        align-self: center;
      }

      .map-pick-row {
        display: flex;
        gap: 8px;
      }

      .map-pick-row button {
        flex: 1 1 0;
        min-height: 44px;
        padding: 0 8px;
        font-size: 14px;
        white-space: nowrap;
      }

      .metric b {
        font-size: 24px;
      }

      #distance {
        color: var(--green);
        font-size: 34px;
        font-weight: 800;
      }

      #distance + span {
        color: var(--green);
      }

      .map-fullscreen-toggle {
        position: absolute;
        z-index: 8;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: rgba(24, 24, 24, .92);
        box-shadow: rgba(0, 0, 0, .36) 0 6px 14px;
        font-size: 18px;
        line-height: 1;
      }

      .map-fullscreen-close {
        display: none;
      }

      .map-fullscreen-toggle {
        left: 12px;
        top: 12px;
      }

      .current-location-button {
        top: 12px;
        right: 34px;
      }

      .map-fullscreen-close {
        left: 12px;
        top: 12px;
      }

      .map-area.is-fullscreen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        width: 100vw;
        height: 100dvh;
        padding: 12px;
        background: var(--bg);
      }

      .map-area.is-fullscreen #map {
        width: 100%;
        height: 100%;
      }

      .map-area.is-fullscreen .map-badge {
        left: 12px;
        right: 12px;
        bottom: 12px;
        max-width: none;
      }

      .map-area.is-fullscreen .map-fullscreen-toggle {
        display: none;
      }

      .map-area.is-fullscreen .map-fullscreen-close {
        display: grid;
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 1002;
      }

      .map-area.is-fullscreen .current-location-button {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 1002;
      }

      body.map-fullscreen-open {
        overflow: hidden;
      }

      #sendWatch {
        width: calc(100% - 44px);
        max-width: calc(100% - 44px);
        margin-inline: 22px;
        box-sizing: border-box;
        justify-self: stretch;
      }

      .pick-label-full {
        display: none;
      }

      .pick-label-short {
        display: inline;
      }
    }

    .map-pick-row { display: none; }

    .map-pick-row button {
      min-height: 36px;
      color: var(--silver);
      background: var(--surface-2);
      letter-spacing: .8px;
    }

    .map-pick-row button.active {
      color: #000;
      background: var(--green);
    }

    .loop-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 9999px;
      color: var(--silver);
      background: var(--surface-2);
      font-size: 14px;
      cursor: pointer;
    }

    .loop-toggle input {
      width: 18px;
      min-height: 18px;
      accent-color: var(--green);
    }

    .place-field {
      position: relative;
      color: var(--green);
    }

    .place-input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .mobile-map-pick {
      display: inline-grid;
      min-height: 42px;
      padding-inline: 12px;
      place-items: center;
      white-space: normal;
      font-size: 11px;
      line-height: 1.15;
    }

        -webkit-backdrop-filter: blur(18px);
        pointer-events: auto;
        transition: height 300ms cubic-bezier(.2, .8, .2, 1);
        touch-action: pan-y;
      }

      .bottom-sheet.is-dragging {
        transition: none;
      }

      .bottom-sheet[data-sheet-state="collapsed"] {
        height: var(--sheet-live-height, calc(clamp(230px, 30dvh, 285px) + env(safe-area-inset-bottom)));
      }

      .bottom-sheet[data-sheet-state="initial"] {
        height: calc(112px + env(safe-area-inset-bottom));
      }

      .bottom-sheet[data-sheet-state="expanded"] {
        height: var(--sheet-live-height, min(49.68dvh, 399.6px));
      }

      .bottom-sheet-handle {
        position: relative;
        z-index: 2;
        display: grid;
        width: 100%;
        height: 38px;
        min-height: 38px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        cursor: grab;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        appearance: none;
        -webkit-appearance: none;
      }

      .bottom-sheet-handle:hover,
      .bottom-sheet-handle:active,
      .bottom-sheet-handle:focus,
      .bottom-sheet-handle:focus-visible {
        border: 0;
        outline: 0;
        background: transparent;
        box-shadow: none;
        transform: none;
      }

      .bottom-sheet-grabber {
        display: block;
        width: 28px;
        height: 22px;
        color: rgba(255, 255, 255, .56);
        transform: translateY(-8px) rotate(0deg);
        transition: transform 220ms ease;
      }

      .bottom-sheet[data-sheet-state="expanded"] .bottom-sheet-grabber {
        transform: translateY(-8px) rotate(180deg);
      }

      .bottom-sheet-grabber svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .bottom-sheet[data-sheet-state="initial"] .bottom-sheet-handle {
        display: none;
      }

      .bottom-sheet-scroll {
        height: calc(100% - 38px);
        overflow: hidden;
        overscroll-behavior: contain;
        touch-action: pan-y;
      }

      .bottom-sheet[data-sheet-state="initial"] .bottom-sheet-scroll {
        height: 100%;
      }

      .bottom-sheet[data-sheet-state="initial"] .result {
        height: 100%;
        align-content: center;
        padding-bottom: env(safe-area-inset-bottom);
      }

      .bottom-sheet[data-sheet-state="expanded"] .bottom-sheet-scroll {
        overflow-y: hidden;
      }

      .bottom-sheet .result {
        position: static;
        display: grid;
        width: auto;
        max-height: none;
        margin: 0;
        padding: 0 12px calc(18px + env(safe-area-inset-bottom));
        gap: 9px;
        overflow: visible;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;

      .bottom-sheet .metric {

        line-height: 1.25;

      .bottom-sheet .sheet-summary {
        display: grid;
        order: -2;
        gap: 10px;
      }

      .bottom-sheet .metric-grid {
        order: initial !important;
      }

      .bottom-sheet .button-row {
        position: static;
        order: initial !important;

        width: 100%;
        max-width: none;

        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;

      }

      .bottom-sheet[data-sheet-state="collapsed"] .metric-grid,

        display: grid;

      }

      .bottom-sheet[data-sheet-state="collapsed"] .sheet-summary,
      .bottom-sheet[data-sheet-state="expanded"] .sheet-summary {
        grid-template-columns: minmax(0, 1.35fr) minmax(132px, 1fr);
        gap: 10px 8px;
      }

      .bottom-sheet[data-sheet-state="collapsed"] .metric-grid,
      .bottom-sheet[data-sheet-state="expanded"] .metric-grid {

      .bottom-sheet[data-sheet-state="expanded"] .result-actions {

        order: 0 !important;
        width: 100%;
        grid-template-columns: 1fr;
        gap: 16px;

      .bottom-sheet .history-nav {

      .bottom-sheet .route-position {

      .bottom-sheet .result #prevRoute,

      .bottom-sheet .result .note {

        padding: 0;
        border: 0;
        border-radius: 0;
        color: #c9c9c9;
        background: transparent;
        box-shadow: none;

        line-height: 1.55;

      .bottom-sheet .result #sendWatch {
        display: block;

        max-width: none;
        min-height: 50px;
        margin: 0 0 2px;
        justify-self: stretch;
        align-self: stretch;
        font-size: 12px;
      }

      body.sheet-initial .app > .current-location-button {
        bottom: calc(max(10px, env(safe-area-inset-bottom)) + 118px);
      }

      body.sheet-collapsed .app > .current-location-button {
        bottom: calc(clamp(230px, 30dvh, 285px) + env(safe-area-inset-bottom) + 8px);
      }

      body.sheet-expanded .app > .current-location-button {
        bottom: calc(min(49.68dvh, 399.6px) + 8px);
      }
    }

    /* Keep the mobile app viewport on every wider screen. */
    @media (min-width: 431px) {
      body {

      }

        width: 430px;

      }
    }
  </style>
</head>

  <script>
    const mobileSplash = document.querySelector("#mobileSplash");
    const removeMobileSplash = () => {
      if (mobileSplash?.isConnected) mobileSplash.remove();
      document.documentElement.classList.remove(
        "mobile-splash-pending",
        "mobile-splash-ready",
        "mobile-splash-flicker",
        "mobile-splash-transition",
        "mobile-splash-exit"
      );
    };

    if (mobileSplash) {
      mobileSplash.addEventListener("animationend", (event) => {
        if (event.target === mobileSplash && event.animationName === "splashOverlayExit") {
          removeMobileSplash();
        }
      });

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const isMobileDevice = window.matchMedia("(pointer: coarse)").matches
        || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      Promise.resolve().then(() => {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          document.documentElement.classList.add("mobile-splash-ready");
          const initialHold = reducedMotion ? 250 : 500;
          const flickerDuration = reducedMotion ? 0 : 400;
          const transitionDuration = reducedMotion ? 100 : 300;
          const finalHold = reducedMotion ? 200 : (isMobileDevice ? 2000 : 900);
          const exitDuration = reducedMotion ? 100 : 250;

          window.setTimeout(() => {
            document.documentElement.classList.add("mobile-splash-flicker");
            window.setTimeout(() => {
              document.documentElement.classList.remove("mobile-splash-flicker");
              document.documentElement.classList.add("mobile-splash-transition");
              window.setTimeout(() => {
                window.setTimeout(() => {
                  document.documentElement.classList.add("mobile-splash-exit");
                  if (!initialLocationRequestStarted) {
                    initialLocationRequestStarted = true;
                    startCurrentLocationTracking({ endpoint: "start" });
                  }
                  window.setTimeout(removeMobileSplash, exitDuration);
                }, finalHold);
              }, transitionDuration);
            }, flickerDuration);
          }, initialHold);
        }));
      });
    }

    function syncBottomSheetLayout() {
      if (!routeButtonRow || !routeForm || !resultPanel || !resultActions) return;
      if (isMobileSheet()) {
        const sheetSummary = resultPanel.querySelector(".sheet-summary");
        const metricGrid = resultPanel.querySelector(".metric-grid");
        const historyNav = resultPanel.querySelector(".history-nav");
        if (sheetSummary && metricGrid?.parentElement !== sheetSummary) {
          sheetSummary.prepend(metricGrid);
        }
        if (sheetSummary && (routeButtonRow.parentElement !== sheetSummary || routeButtonRow.nextElementSibling !== historyNav)) {

    function setBottomSheetState(state) {
      if (state === "route") state = "collapsed";
      if (!bottomSheet || !["initial", "collapsed", "expanded"].includes(state)) return;
      const hasRoute = bottomSheet.classList.contains("has-route-sheet");
      const resolvedState = !hasRoute && (state === "collapsed" || state === "expanded") ? "initial" : state;
      bottomSheet.dataset.sheetState = resolvedState;
      bottomSheet.style.removeProperty("--sheet-live-height");
      document.body.classList.remove("sheet-initial", "sheet-collapsed", "sheet-expanded");
      document.body.classList.add(`sheet-${resolvedState}`);
      if (resolvedState !== "expanded" && bottomSheetScroll) bottomSheetScroll.scrollTop = 0;
      bottomSheetHandle?.setAttribute("aria-expanded", String(resolvedState === "expanded"));
    }

    function initializeBottomSheetDrag() {
      if (!bottomSheet || !bottomSheetHandle) return;
      syncBottomSheetLayout();
      const metricDragSurface = bottomSheet.querySelector(".metric-grid");
      let startY = 0;
      let deltaY = 0;
      let dragging = false;
      let dragged = false;
      let startHeight = 0;
      let collapsedHeight = 0;
      let expandedHeight = 0;

      const beginDrag = (clientY) => {
        if (!isMobileSheet() || !["collapsed", "expanded"].includes(bottomSheet.dataset.sheetState)) return false;
        startY = clientY;
        deltaY = 0;
        startHeight = bottomSheet.getBoundingClientRect().height;
        const viewportHeight = window.visualViewport?.height || window.innerHeight;
        collapsedHeight = Math.min(285, Math.max(230, viewportHeight * .30));
        expandedHeight = Math.min(viewportHeight * .4968, 399.6);
        dragging = true;
        dragged = false;
        bottomSheet.classList.add("is-dragging");
        return true;
      };

      const moveDrag = (clientY) => {
        if (!dragging) return;
        deltaY = clientY - startY;
        dragged = dragged || Math.abs(deltaY) > 5;
        const liveHeight = Math.max(collapsedHeight, Math.min(expandedHeight, startHeight - deltaY));
        bottomSheet.style.setProperty("--sheet-live-height", `${liveHeight}px`);
      };

      const snapAfterDrag = () => {
        if (!dragging) return;
        dragging = false;
        bottomSheet.classList.remove("is-dragging");
        const state = bottomSheet.dataset.sheetState;
        if (!dragged) {
          bottomSheet.style.removeProperty("--sheet-live-height");
          return;
        }
        if (state === "collapsed" && deltaY < -72) {
          setBottomSheetState("expanded");
        } else if (state === "expanded" && deltaY > 72) {
          setBottomSheetState("collapsed");
        } else {
          setBottomSheetState(state);
        }
      };

      bottomSheetHandle.addEventListener("pointerdown", (event) => {
        if (!beginDrag(event.clientY)) return;
        bottomSheetHandle.setPointerCapture?.(event.pointerId);
      });

      bottomSheetHandle.addEventListener("pointermove", (event) => {
        moveDrag(event.clientY);
      });

      const finishDrag = (event) => {
        if (!dragging) return;
        bottomSheetHandle.releasePointerCapture?.(event.pointerId);
        snapAfterDrag();
      };

      bottomSheetHandle.addEventListener("pointerup", finishDrag);
      bottomSheetHandle.addEventListener("pointercancel", finishDrag);

      if (metricDragSurface) {
        metricDragSurface.addEventListener("pointerdown", (event) => {
          if (!beginDrag(event.clientY)) return;
          metricDragSurface.setPointerCapture?.(event.pointerId);
        });
        metricDragSurface.addEventListener("pointermove", (event) => moveDrag(event.clientY));
        metricDragSurface.addEventListener("pointerup", snapAfterDrag);
        metricDragSurface.addEventListener("pointercancel", snapAfterDrag);
      }

      bottomSheetHandle.addEventListener("click", () => {
        if (!isMobileSheet() || dragged) return;
        const state = bottomSheet.dataset.sheetState;
        if (state === "collapsed") setBottomSheetState("expanded");
        else if (state === "expanded") setBottomSheetState("collapsed");
      });

      window.addEventListener("resize", syncBottomSheetLayout);
    }

      recentSearches = recentSearches.filter((entry) => (

      recentSearches.unshift({ startLabel, endLabel });
      renderRecentSearch();
    }

    function latLngToTm(lat, lng) {
      return {
        x: 200000 + (lng - 127) * 111000 * Math.cos(lat * Math.PI / 180),
        y: 600000 + (lat - 38) * 111000
      };
    }

    function initMap() {
      if (!KAKAO_READY) {
        statusEl.textContent = "카카오 지도 SDK를 불러오지 못했습니다. 카카오 앱 키의 JavaScript 플랫폼 도메인 설정을 확인해 주세요.";

    function showCurrentLocation(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      if (!Number.isFinite(lat) || !Number.isFinite(lng) || !map) return;
      const firstLocation = !currentLocationPoint;
      currentLocationRequestFromUser = false;
      currentLocationPoint = { lat, lng };
      const mapPosition = new kakao.maps.LatLng(lat, lng);
      if (!currentLocationOverlay) {
        currentLocationOverlay = new kakao.maps.CustomOverlay({
          position: mapPosition,
          content: '<div class="current-location-dot" title="현재 위치"></div>',
          xAnchor: .5,
          yAnchor: .5,
          zIndex: 12
        });
        currentLocationOverlay.setMap(map);
      } else {
        currentLocationOverlay.setPosition(mapPosition);
      }
      currentLocationBtn.disabled = false;
      currentLocationBtn.classList.add("active");
      currentLocationBtn.textContent = "◎ 현재 위치";
      if (firstLocation) {
        map.setLevel(3);
        map.panTo(mapPosition);
      }

      if (currentLocationInputTarget) {
        const target = currentLocationInputTarget;
        currentLocationInputTarget = null;
        setEndpointFromCurrentLocation(target, lat, lng);
      }
    }

    function setEndpointFromCurrentLocation(target, lat, lng) {
      const isStart = target === "start";
      const input = isStart ? startInput : endInput;
      const selected = { lat, lng, ...latLngToTm(lat, lng), label: "현재 위치" };
      input.value = selected.label;
      input.placeholder = isStart ? "시작점을 입력해 주세요" : "어디까지 달릴까요?";
      if (isStart) {
        selectedStartPlace = selected;
        syncLoopDestination();
      } else {
        selectedEndPlace = selected;
      }
      lastStart = null;
      lastEnd = null;
      setWatchButtonVisible(false);
      resetRoutesHistory();

      if (geocoder && typeof geocoder.coord2Address === "function") {
        geocoder.coord2Address(lng, lat, (results, status) => {
          if (status !== kakao.maps.services.Status.OK || !results?.[0]) return;
          const address = results[0].road_address?.address_name || results[0].address?.address_name;
          const selectionIsCurrent = isStart ? selectedStartPlace === selected : selectedEndPlace === selected;
          if (!address || !selectionIsCurrent) return;
          selected.label = address;
          input.value = address;
          if (isStart) syncLoopDestination();
        });
      }
    }

    function handleLocationError(error) {
      currentLocationBtn.disabled = false;
      currentLocationBtn.classList.remove("active");
      const messages = {
        1: "현재 위치 권한이 거부되었습니다. 브라우저 설정에서 위치 권한을 허용해 주세요.",
        2: "현재 위치를 확인할 수 없습니다.",
        3: "현재 위치 확인 시간이 초과되었습니다."
      };
      if (currentLocationInputTarget) {
        const failedTarget = currentLocationInputTarget;
        currentLocationInputTarget = null;
        const input = failedTarget === "start" ? startInput : endInput;
        input.value = "";
        input.placeholder = failedTarget === "start" ? "시작점을 입력해 주세요" : "어디까지 달릴까요?";
      }
      statusEl.textContent = messages[error.code] || "현재 위치를 확인하지 못했습니다.";
    }

    function startCurrentLocationTracking({ endpoint = null, userInitiated = false } = {}) {
      if (!navigator.geolocation) {
        statusEl.textContent = "이 브라우저에서는 현재 위치 기능을 지원하지 않습니다.";
        startInput.placeholder = "시작점을 입력해 주세요";
        return;
      }
      if (endpoint === "start" || endpoint === "end") currentLocationInputTarget = endpoint;
      if (currentLocationPoint) {
        map.panTo(new kakao.maps.LatLng(currentLocationPoint.lat, currentLocationPoint.lng));
        if (currentLocationInputTarget) {
          const target = currentLocationInputTarget;
          currentLocationInputTarget = null;
          setEndpointFromCurrentLocation(target, currentLocationPoint.lat, currentLocationPoint.lng);
        }
      }
      if (currentLocationWatchId !== null) return;
      currentLocationRequestFromUser = userInitiated;
      currentLocationBtn.disabled = true;
      currentLocationBtn.textContent = "위치 확인 중…";
      currentLocationWatchId = navigator.geolocation.watchPosition(
        showCurrentLocation,
        (error) => {
          const wasUserInitiated = currentLocationRequestFromUser;
          currentLocationRequestFromUser = false;
          currentLocationWatchId = null;
          handleLocationError(error);
          if (wasUserInitiated && error.code === 1) {
            alert("위치 권한이 차단되어 있습니다. 브라우저 또는 기기 설정에서 이 사이트의 위치 권한을 허용해 주세요.");
          }
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 12000 }
      );
    }

    async function handleCurrentLocationButtonClick() {

        try {
          const permission = await navigator.permissions.query({ name: "geolocation" });
          if (permission.state === "denied") {
            alert("위치 권한이 차단되어 있습니다. 브라우저 또는 기기 설정에서 이 사이트의 위치 권한을 허용해 주세요.");

          }
        } catch (error) {
          console.warn("위치 권한 상태를 확인하지 못했습니다.", error);

    function parseCoordinate(text) {
      const match = text.trim().match(/(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/);
      if (!match) return null;
      const a = Number(match[1]);
      const b = Number(match[2]);
      if (Math.abs(a) <= 90 && Math.abs(b) <= 180) return { lat: a, lng: b, label: text.trim(), ...latLngToTm(a, b) };
      if (Math.abs(b) <= 90 && Math.abs(a) <= 180) return { lat: b, lng: a, label: text.trim(), ...latLngToTm(b, a) };
      return null;
    }

    function findLocalPlace(text) {
      const normalized = text.trim().replace(/\s/g, "");
      for (const [name, latLng] of Object.entries(landmarks)) {
        const key = name.replace(/\s/g, "");
        if (key === normalized) {
          const tm = latLngToTm(latLng[0], latLng[1]);
          return { label: name, lat: latLng[0], lng: latLng[1], ...tm };
        }
      }
      return null;
    }

    async function kakaoPlaceSearch(text) {
      const rows = await searchKakaoPlaces(text);
      if (!rows.length) throw new Error(`장소를 찾을 수 없습니다: ${text}`);
      const row = rows[0];
      const lat = Number(row.y);
      const lng = Number(row.x);
      return { label: row.place_name || text, lat, lng, ...latLngToTm(lat, lng) };
    }

    async function searchKakaoPlaces(text) {
      const query = text.trim();
      if (query.length < 2) return [];
      const cacheKey = query.toLocaleLowerCase("ko-KR");
      if (placeSearchCache.has(cacheKey)) return placeSearchCache.get(cacheKey);
      if (placeSearchRequests.has(cacheKey)) return placeSearchRequests.get(cacheKey);

      const request = fetch(`${KAKAO_PLACE_API_URL}?query=${encodeURIComponent(query)}`)
        .then(async (response) => {
          if (!response.ok) return [];
          const data = await response.json();
          const rows = (data.documents || []).slice(0, 10);
          placeSearchCache.set(cacheKey, rows);
          return rows;
        })
        .finally(() => placeSearchRequests.delete(cacheKey));
      placeSearchRequests.set(cacheKey, request);
      return request;
    }

    function hideSuggestions(container) {
      container.classList.remove("active");
      container.innerHTML = "";
    }

    function renderPlaceSuggestions(input, container, rows) {
      container.innerHTML = "";
      if (!rows.length) {
        hideSuggestions(container);
        return;
      }

      rows.forEach((row) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "place-suggestion";
        const name = document.createElement("span");
        const address = document.createElement("small");
        name.textContent = row.place_name;
        address.textContent = row.road_address_name || row.address_name || "";
        button.append(name, address);
        button.addEventListener("click", () => {
          const selected = {
            label: row.place_name,
            lat: Number(row.y),
            lng: Number(row.x),
            ...latLngToTm(Number(row.y), Number(row.x))
          };
          input.value = row.place_name;
          if (input === startInput) {
            selectedStartPlace = selected;
            if (loopRouteInput.checked) selectedEndPlace = selected;
            syncLoopDestination();
          } else {
            selectedEndPlace = selected;
          }
          hideSuggestions(container);
          setWatchButtonVisible(false);
          lastStart = null;
          lastEnd = null;
          resetRoutesHistory();
          map.panTo(toLatLng(selected));
        });
        container.appendChild(button);
      });

      container.classList.add("active");
    }

    function renderRecentPlaceSuggestions(input, container) {
      const isStart = input === startInput;
      const labels = [...new Set(recentSearches.map((entry) => (
        isStart ? entry.startLabel : entry.endLabel
      )).filter(Boolean))];
      container.innerHTML = "";
      if (!labels.length) {
        hideSuggestions(container);
        return;
      }

      const heading = document.createElement("div");
      heading.className = "suggestion-heading";
      heading.textContent = "최근 검색";
      container.appendChild(heading);

      labels.forEach((label) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "place-suggestion";
        button.textContent = label;
        button.addEventListener("click", () => {
          input.value = label;
          if (isStart) {
            selectedStartPlace = null;
            syncLoopDestination();
          } else {
            selectedEndPlace = null;
          }
          hideSuggestions(container);
          setWatchButtonVisible(false);
          lastStart = null;
          lastEnd = null;
          resetRoutesHistory();
        });
        container.appendChild(button);
      });
      container.classList.add("active");
    }

    function attachPlaceAutocomplete(input, container, timerName) {
      input.addEventListener("input", () => {
        if (timerName === "start") {
          selectedStartPlace = null;
          if (loopRouteInput.checked) selectedEndPlace = null;
        } else {
          selectedEndPlace = null;
        }
        clearTimeout(timerName === "start" ? startSuggestTimer : endSuggestTimer);
        if (!input.value.trim()) {
          renderRecentPlaceSuggestions(input, container);
          return;
        }
        const run = async () => {
          const query = input.value.trim();
          const rows = await searchKakaoPlaces(query);
          if (input.value.trim() !== query) return;
          renderPlaceSuggestions(input, container, rows);
        };

        if (timerName === "start") {
          startSuggestTimer = setTimeout(run, 60);
        } else {
          endSuggestTimer = setTimeout(run, 60);
        }
      });

      input.addEventListener("focus", () => {
        if (!input.value.trim()) renderRecentPlaceSuggestions(input, container);
      });

      input.addEventListener("blur", () => {
        setTimeout(() => hideSuggestions(container), 160);
      });
    }

    async function geocode(text) {
      const coord = parseCoordinate(text);
      if (coord) return coord;
      const local = findLocalPlace(text);
      if (local) return local;
      return kakaoPlaceSearch(text);
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function latLngToRoutePoint(lat, lng) {
      return { lat, lng, ...latLngToTm(lat, lng) };
    }

    function localPointToLatLng(point) {
      if (Number.isFinite(point.lat) && Number.isFinite(point.lng)) return [point.lat, point.lng];
      const lat = 38 + ((point.y - 600000) / 111000);
      const lng = 127 + ((point.x - 200000) / (111000 * Math.cos(lat * Math.PI / 180)));
      return [lat, lng];
    }

    function buildLoopWaypointSets(start, targetMeters, generation = 0) {
      const radius = Math.min(
        Math.max(targetMeters / (Math.PI * 2) * 1.02, Math.max(160, targetMeters * .11)),
        1700
      );
      const basePatterns = [
        [0, 90, 180, 270],
        [45, 135, 225, 315],
        [0, 72, 144, 216, 288],
        [36, 108, 180, 252, 324],
        [-90, -15, 15, 90],
        [90, 165, 195, 270],
        [0, 120, 240],
        [60, 180, 300]
      ];
      const rotations = [0, 18, 36, 54, 72, 90, 126, 162];
      const scales = [.72, .86, 1, 1.14, 1.3];
      const sets = [];
      const phase = (generation * 13) % 360;

      rotations.forEach((rotation, rotationIndex) => {
        basePatterns.forEach((pattern, patternIndex) => {
          const scale = scales[(rotationIndex + patternIndex + generation) % scales.length];
          const stretch = patternIndex % 2 ? 1.18 : .88;
          const points = pattern.map((deg, pointIndex) => {
            const wobble = pointIndex % 2 ? 12 : -8;
            const rad = (deg + rotation + wobble + phase) * Math.PI / 180;
            return {
              x: start.x + Math.cos(rad) * radius * scale * stretch,
              y: start.y + Math.sin(rad) * radius * scale / stretch
            };
          });
          sets.push([start, ...points, start]);
        });
      });

      return sets;
    }

    function buildWaypointSets(start, end, targetMeters, generation = 0) {
      if (distance(start, end) < 80) return buildLoopWaypointSets(start, targetMeters, generation);
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const direct = Math.max(distance(start, end), 1);
      const nx = -dy / direct;
      const ny = dx / direct;
      const tx = dx / direct;
      const ty = dy / direct;
      const detour = Math.max(targetMeters - direct, targetMeters * .24);
      const side = Math.min(
        Math.max(detour / 3.2, Math.max(180, targetMeters * .14)),
        targetMeters * .42
      );
      const forward = Math.min(
        Math.max(targetMeters / 7.5, Math.max(140, targetMeters * .1)),
        targetMeters * .28
      );
      const center = { x: (start.x + end.x) / 2, y: (start.y + end.y) / 2 };
      const sideFactors = [1, -1, 1.28, -1.28, .7, -.7, 1.55, -1.55, .42, -.42, 1.9, -1.9, .25, -.25, 2.15, -2.15];
      const pushFactors = [.34, -.34, .12, -.12, .56, -.56, .74, -.74];
      // 첫 탐색은 기존에 검증된 후보 형상을 그대로 사용한다. 후보가
      // 소진된 다음 세대부터만 방향과 굴곡을 조금씩 바꾼다.
      const spreadScale = generation === 0 ? 1 : .88 + (generation % 7) * .045;
      const pushOffset = generation === 0 ? 0 : ((generation % 9) - 4) * .025;

      return sideFactors.flatMap((sign, index) => {
        const spread = side * sign * spreadScale;
        return pushFactors.slice(0, index < 4 ? 5 : 3).map((pushFactor, pushIndex) => {
          const push = forward * (pushFactor + pushOffset);
          const bend = (pushIndex % 2 ? -.22 : .22) * side;
          const a = { x: center.x - tx * forward + nx * spread + tx * push, y: center.y - ty * forward + ny * spread + ty * push };
          const b = { x: center.x + tx * forward + nx * spread * .9 - tx * push, y: center.y + ty * forward + ny * spread * .9 - ty * push };
          const c = { x: center.x + nx * (spread * .32 + bend) - tx * forward * .16, y: center.y + ny * (spread * .32 + bend) - ty * forward * .16 };
          return index < 2 ? [start, a, b, end] : [start, a, c, b, end];
        });
      });
    }

    async function fetchPedestrianRoute(points, routeMode = "BROAD_FIRST") {
      const coordinates = points.map(localPointToLatLng).map(([lat, lng]) => ({ lat, lng }));
      const response = await fetch(KAKAO_WALK_API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ points: coordinates, routeMode })
      });
      if (!response.ok) {
        const errorBody = await response.json().catch(() => ({}));
        const error = new Error(errorBody.message || "카카오 도보 경로 API 응답이 없습니다.");
        error.code = errorBody.code;
        error.isApiLimit = errorBody.code === -10 || /limit|한도/i.test(error.message);
        error.showAlert = error.isApiLimit;
        throw error;
      }
      const data = await response.json();
      if (data.status !== "OK" || !data.route) {
        throw new Error(`카카오 도보 경로를 찾지 못했습니다. (${data.status || "UNKNOWN"})`);
      }

      const steps = (data.route.legs || []).flatMap((leg) => leg.steps || []);
      const latLngs = [];
      steps.forEach((step) => {
        (step.path?.points || []).forEach(([lng, lat]) => {
          const previous = latLngs[latLngs.length - 1];
          if (!previous || previous[0] !== lat || previous[1] !== lng) latLngs.push([lat, lng]);
        });
      });
      if (latLngs.length < 2) throw new Error("카카오 경로 좌표가 비어 있습니다.");

      const tmPoints = latLngs.map(([lat, lng]) => latLngToRoutePoint(lat, lng));
      const pedestrianGuides = steps.map((step) => ({
        guidance: step.properties?.guidance || "",
        distance: step.properties?.distance || 0,
        time: step.properties?.time || 0,
        lat: step.properties?.y,
        lng: step.properties?.x
      })).filter((step) => step.guidance);
      const crossingGuides = pedestrianGuides.filter((step) => /횡단보도/.test(step.guidance));
      const facilityGuides = pedestrianGuides.filter((step) => /육교|지하도|계단|경사로|엘리베이터|역사 내|보행자/.test(step.guidance));

      return {
        latLngs,
        tmPoints,
        meters: data.route.properties?.totalDistance,
        seconds: data.route.properties?.totalTime,
        landingUrl: data.route.properties?.landingUrl,
        pedestrianGuides,
        crossingGuides,
        facilityGuides,
        crossed: crossingGuides.length,
        routeMode,
        source: "kakao-walk"
      };
    }

    function routeCandidateKey(start, end, targetRange) {
      return [
        start.lat.toFixed(5),
        start.lng.toFixed(5),
        end.lat.toFixed(5),
        end.lng.toFixed(5),
        targetRange.min,
        targetRange.max
      ].join("|");
    }

    function ensureRouteCandidateState(start, end, targetRange) {
      const cacheKey = routeCandidateKey(start, end, targetRange);
      if (!routeCandidateState || routeCandidateState.key !== cacheKey) {
        const targetMeters = (targetRange.min + targetRange.max) / 2;
        const generation = routeCandidateGeneration++;
        const routeMode = ROUTE_MODES[Math.min(generation, ROUTE_MODES.length - 1)];
        routeCandidateState = {
          key: cacheKey,
          generation,
          routeMode,
          waypointSets: buildWaypointSets(start, end, targetMeters, generation),
          nextIndex: 0,
          shownRouteSignatures,
          candidateSignatures: new Set(),
          rankedCandidates: []
        };
      }
      return routeCandidateState;
    }

    function routeTargetDelta(route, targetRange) {
      const targetMeters = (targetRange.min + targetRange.max) / 2;
      return Math.abs(route.meters - targetMeters);
    }

    function compareRouteCandidates(a, b, targetRange) {
      return Number(!a.insideTargetRange) - Number(!b.insideTargetRange)
        || a.crossed - b.crossed
        || routeTargetDelta(a, targetRange) - routeTargetDelta(b, targetRange)
        || a.meters - b.meters;
    }

    function isRouteInsideRecommendationRange(route, targetRange) {
      return route.meters >= targetRange.min * .8 && route.meters <= targetRange.max * 1.2;
    }

    async function collectRouteCandidates(state, targetRange) {
      const waypoints = [];

      while (
        state.waypointSets.length
        && state.nextIndex < state.waypointSets.length
        && waypoints.length < ROUTE_CANDIDATE_BATCH_ATTEMPTS
      ) {
        waypoints.push(state.waypointSets[state.nextIndex]);
        state.nextIndex += 1;
      }

      const results = await Promise.allSettled(
        waypoints.map((waypoint) => fetchPedestrianRoute(waypoint, state.routeMode))
      );
      let collected = 0;
      let fulfilled = 0;
      let firstError = null;

      results.forEach((result) => {
        if (result.status !== 'fulfilled') {
          firstError ||= result.reason;
          console.warn(result.reason);
          return;
        }

        fulfilled += 1;
        const candidate = result.value;
        if (!isRouteInsideRecommendationRange(candidate, targetRange)) return;
        candidate.insideTargetRange = isRouteInsideTargetRange(candidate, targetRange);

        const signature = routeSignature(candidate);
        if (state.candidateSignatures.has(signature)) return;

        state.candidateSignatures.add(signature);
        state.rankedCandidates.push(candidate);
        collected += 1;
      });

      if (waypoints.length && fulfilled === 0 && firstError) throw firstError;

      state.rankedCandidates.sort((a, b) => compareRouteCandidates(a, b, targetRange));
      console.info('[Route candidates] ranked pool', {
        attempted: waypoints.length,
        routeMode: state.routeMode,
        collected,
        totalRanked: state.rankedCandidates.length,
        nextIndex: state.nextIndex,
        remainingWaypoints: Math.max(0, state.waypointSets.length - state.nextIndex),
        rankedPreview: state.rankedCandidates.slice(0, 8).map((route) => ({
          distanceMeters: Math.round(route.meters),
          kakaoGuidedCrossings: route.crossed
        }))
      });
    }
    function nextRankedRouteCandidate(state) {
      return state.rankedCandidates.find((candidate) => {
        const signature = routeSignature(candidate);
        return !state.shownRouteSignatures.has(signature)
          && candidate.crossed >= lastShownCrossingCount;
      }) || null;
    }

    async function choosePedestrianRoute(start, end, targetRange) {
      const state = ensureRouteCandidateState(start, end, targetRange);

      if (!state.rankedCandidates.length) {
        const lookahead = state.generation === 0
          ? INITIAL_ROUTE_CANDIDATE_LOOKAHEAD
          : ROUTE_CANDIDATE_BATCH_ATTEMPTS;
        while (
          state.nextIndex < state.waypointSets.length
          && state.nextIndex < lookahead
        ) {
          await collectRouteCandidates(state, targetRange);
        }
      }

      const candidate = nextRankedRouteCandidate(state);
      if (!candidate) return null;

      const signature = routeSignature(candidate);
      state.shownRouteSignatures.add(signature);
      lastShownCrossingCount = candidate.crossed;
      return candidate;
    }
    function isRouteInsideTargetRange(route, targetRange) {
      return route.meters >= targetRange.min && route.meters <= targetRange.max;
    }

    function routeSignature(route) {
      const points = route.tmPoints || [];
      if (!points.length) {
        return `${Math.round(route.meters / 10)}|empty`;
      }
      const indexes = [
        0,
        Math.floor(points.length / 4),
        Math.floor(points.length / 2),
        Math.floor(points.length * 3 / 4),
        points.length - 1
      ];
      const sampled = indexes.map((index) => {
        const point = points[Math.min(points.length - 1, Math.max(0, index))];
        return `${Math.round(point.x / 3)},${Math.round(point.y / 3)}`;
      });
      return [Math.round(route.meters / 10), ...sampled].join("|");
    }

    function parseTargetRange() {
      const value = document.querySelector("input[name='targetRange']:checked").value;
      const [minKm, maxKm] = value.split("-").map(Number);
      return { min: minKm * 1000, max: maxKm * 1000, label: value };
    }

    function formatKmRange(range) {
      return `${Math.round(range.min / 1000)}-${Math.round(range.max / 1000)}km`;
    }

    function trackAnalyticsEvent(eventName, params = {}) {
      if (typeof gtag !== "function") return;
      gtag("event", eventName, {
        app_name: "STOPLESS",
        ...params
      });
    }

    function setWatchButtonVisible(isVisible) {
      sendWatchBtn.hidden = !isVisible;
    }

    function addRouteArrows(path) {
      if (!path.length) return;
      const tmPath = path.map((point) => ({
        lat: point.getLat(),
        lng: point.getLng(),
        ...latLngToTm(point.getLat(), point.getLng())
      }));
      const segmentLengths = [];
      let totalLength = 0;

      for (let i = 0; i < tmPath.length - 1; i += 1) {
        const length = distance(tmPath[i], tmPath[i + 1]);
        segmentLengths.push(length);
        totalLength += length;
      }

      if (totalLength < 120) return;

      const spacing = Math.max(70, Math.min(130, totalLength / 26));
      for (let target = spacing; target < totalLength - spacing * .45; target += spacing) {
        let walked = 0;
        for (let i = 0; i < segmentLengths.length; i += 1) {
          const segmentLength = segmentLengths[i];
          if (walked + segmentLength < target || segmentLength < 1) {
            walked += segmentLength;
            continue;
          }

          const from = tmPath[i];
          const to = tmPath[i + 1];
          const ratio = (target - walked) / segmentLength;
          const x = from.x + (to.x - from.x) * ratio;
          const y = from.y + (to.y - from.y) * ratio;
          const [lat, lng] = localPointToLatLng({ x, y });
          const angle = Math.atan2(to.x - from.x, to.y - from.y) * 180 / Math.PI;
          const overlay = new kakao.maps.CustomOverlay({
            position: new kakao.maps.LatLng(lat, lng),
            content: `<div class="route-arrow" style="transform: rotate(${angle}deg)"></div>`,
            xAnchor: .5,
            yAnchor: .5,
            zIndex: 4
          });
          overlay.setMap(map);
          overlays.push(overlay);
          break;
        }
      }
    }

    function drawBlueRoute(path, weight = 8) {
      const casing = new kakao.maps.Polyline({
        path,
        strokeWeight: weight + 7,
        strokeColor: "#FFFFFF",
        strokeOpacity: .94,
        strokeStyle: "solid"
      });
      const line = new kakao.maps.Polyline({
        path,
        strokeWeight: weight,
        strokeColor: "#3E6AE1",
        strokeOpacity: .98,
        strokeStyle: "solid"
      });
      casing.setMap(map);
      line.setMap(map);
      polylines.push(casing, line);
      addRouteArrows(path);
      return line;
    }

    function addPin(point, title) {
      const overlay = new kakao.maps.CustomOverlay({
        position: toLatLng(point),
        content: `<div class="pin" title="${title}"></div>`,
        yAnchor: 1
      });
      overlay.setMap(map);
      overlays.push(overlay);
    }

    function drawCrossings(crossings) {
      crossings.forEach((p) => {
        const circle = new kakao.maps.Circle({
          center: toLatLng(p),
          radius: 7,
          strokeWeight: 1,
          strokeColor: "#D92027",
          strokeOpacity: .72,
          fillColor: "#D92027",
          fillOpacity: .58
        });
        circle.setMap(map);
        circles.push(circle);
      });
    }

    function drawRoute(start, end, route, targetRange, { preserveSheet = false } = {}) {
      document.querySelector(".result")?.classList.add("has-route");
      document.body.classList.add("route-ready");
      bottomSheet?.classList.add("has-route-sheet");
      if (isMobileSheet() && !preserveSheet) setBottomSheetState("collapsed");
      clearMap();
      clearDraftPins();
      const path = route.latLngs.map(([lat, lng]) => new kakao.maps.LatLng(lat, lng));
      drawBlueRoute(path, 8);

      drawCrossings(route.crossingGuides.filter((guide) => Number.isFinite(guide.lat) && Number.isFinite(guide.lng)));
      addPin(start, "시작점");
      addPin(end, "도착점");

      const bounds = new kakao.maps.LatLngBounds();
      path.forEach((point) => bounds.extend(point));
      bounds.extend(toLatLng(start));
      bounds.extend(toLatLng(end));
      lastRouteBounds = bounds;
      map.setBounds(bounds, 56, 56, 56, 56);

      const km = route.meters / 1000;
      const routeModeLabel = {
        BROAD_FIRST: "큰길 우선",
        SHORTEST: "최단 경로",
        ACCESSIBLE: "접근성 우선"
      }[route.routeMode] || "보행 경로";
      distanceEl.textContent = `${km.toFixed(2)} km`;
      crossingsEl.textContent = `${route.crossed}개`;
      statusEl.textContent = route.insideTargetRange
        ? `${formatKmRange(targetRange)} 조건에 맞는 카카오 ${routeModeLabel} 보행 경로를 선택했습니다. FIND NEW는 다음 후보를 보여줍니다.`
        : `${formatKmRange(targetRange)}에 가장 가까운 카카오 ${routeModeLabel} 보행 경로를 선택했습니다. FIND NEW는 횡단보도 수와 관계없이 다음 후보를 보여줍니다.`;
      const facilitySummary = route.facilityGuides.length ? ` 기타 보행 안내 ${route.facilityGuides.length}건도 반영했습니다.` : "";
      mapBadgeEl.textContent = `파란 선은 카카오 도보 경로입니다. 빨간 점 ${route.crossed}개는 안내 문구에 명시된 횡단 지점이며 전수 데이터는 아닙니다.${facilitySummary}`;
      setWatchButtonVisible(true);
    }

    function updateRouteNavButtons() {
      prevRouteBtn.disabled = currentRouteIndex <= 0;
      nextRouteBtn.disabled = currentRouteIndex < 0 || currentRouteIndex >= routesHistory.length - 1;
      if (routePositionEl) {
        routePositionEl.textContent = currentRouteIndex >= 0
          ? `${currentRouteIndex + 1} / ${routesHistory.length}`
          : "0 / 0";
      }
    }

    function resetRoutesHistory({ preserveRunDisabled = false } = {}) {
      document.querySelector(".result")?.classList.remove("has-route");
      document.body.classList.remove("route-ready");
      bottomSheet?.classList.remove("has-route-sheet");
      if (isMobileSheet()) setBottomSheetState("initial");
      if (!preserveRunDisabled) makeRouteBtn.disabled = false;
      routesHistory = [];
      currentRouteIndex = -1;
      routeCandidateState = null;
      routeCandidateGeneration = 0;
      shownRouteSignatures = new Set();
      lastShownCrossingCount = -1;
      updateRouteNavButtons();
    }

    function appendRouteToHistory(start, end, route, targetRange) {
      routesHistory.push({ start, end, route, targetRange });
      currentRouteIndex = routesHistory.length - 1;
      updateRouteNavButtons();
    }

    function showStoredRoute(index) {
      if (index < 0 || index >= routesHistory.length) return;
      currentRouteIndex = index;
      const entry = routesHistory[currentRouteIndex];
      drawRoute(entry.start, entry.end, entry.route, entry.targetRange, { preserveSheet: true });
      updateRouteNavButtons();
    }

    function showPreviousRoute() {
      showStoredRoute(currentRouteIndex - 1);
    }

    function showNextRoute() {
      showStoredRoute(currentRouteIndex + 1);
    }

    async function ensureRouteEndpoints(targetRange, useLoop, startText, endText) {
      lastStart = selectedStartPlace && selectedStartPlace.label === startText
        ? selectedStartPlace
        : await geocode(startText);
      lastEnd = useLoop
        ? { ...lastStart, label: `${lastStart.label} 루프` }
        : selectedEndPlace && selectedEndPlace.label === endText
          ? selectedEndPlace
          : await geocode(endText);

      if (!useLoop && distance(lastStart, lastEnd) > targetRange.max) {
        const error = new Error(`시작점과 도착점 사이의 직선거리가 ${formatKmRange(targetRange)}의 최대 거리보다 깁니다. 목표 거리를 늘리거나 시작/도착점을 다시 선택해 주세요.`);
        error.showAlert = true;
        throw error;
      }
    }

    async function createAndStoreRoute({ reset = false } = {}) {
      const startText = startInput.value.trim();
      const endText = endInput.value.trim();
      const targetRange = parseTargetRange();
      const useLoop = loopRouteInput.checked || !endText;
      if (!startText || (!useLoop && !endText)) {
        setWatchButtonVisible(false);
        statusEl.textContent = "시작점을 입력해 주세요. 루프가 아니라면 도착점도 필요합니다.";
        return;
      }
      if (!KAKAO_READY) return;

      setWatchButtonVisible(false);
      makeRouteBtn.disabled = true;
      findNewBtn.disabled = true;
      prevRouteBtn.disabled = true;
      nextRouteBtn.disabled = true;
      statusEl.textContent = reset
        ? `${formatKmRange(targetRange)} 범위 안에서 첫 추천 코스를 찾고 있습니다.`
        : `${formatKmRange(targetRange)} 조건에서 새 추천 코스를 하나 찾고 있습니다.`;

      try {
        if (reset || !lastStart || !lastEnd) {
          resetRoutesHistory({ preserveRunDisabled: true });
          await ensureRouteEndpoints(targetRange, useLoop, startText, endText);
          if (reset) saveRecentSearch(lastStart, lastEnd, useLoop);
        }

        const route = await choosePedestrianRoute(lastStart, lastEnd, targetRange);
        if (!route) {
          if (reset) {
            alert("현재 조건에서 추천 경로를 찾지 못했습니다. 거리나 출발 조건을 변경해 주세요.");
            statusEl.textContent = `${formatKmRange(targetRange)} 범위의 추천 경로를 찾지 못했습니다.`;
          } else {
            setWatchButtonVisible(true);
            statusEl.textContent = "준비된 코스를 모두 확인했습니다.";
            showCoursePoolDialog();
          }
          return;
        }

        appendRouteToHistory(lastStart, lastEnd, route, targetRange);
        drawRoute(lastStart, lastEnd, route, targetRange, { preserveSheet: !reset });
      } catch (error) {
        setWatchButtonVisible(false);
        statusEl.textContent = error.isApiLimit
          ? "오늘의 경로 검색 한도에 도달했습니다."
          : error.message || "코스를 계산하지 못했습니다.";
        if (error.isApiLimit) showApiLimitDialog();
        else if (error.showAlert) alert(error.message);
      } finally {
        makeRouteBtn.disabled = bottomSheet?.classList.contains("has-route-sheet") || false;
        findNewBtn.disabled = false;
        updateRouteNavButtons();
      }
    }
    document.querySelector("#routeForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const targetRange = parseTargetRange();
      trackAnalyticsEvent("run_click", {
        button_text: "RUN!",
        target_range: formatKmRange(targetRange),
        loop_route: loopRouteInput.checked ? "yes" : "no"
      });
      createAndStoreRoute({ reset: true });
    });

    findNewBtn.addEventListener("click", () => createAndStoreRoute({ reset: false }));
    swapPlacesBtn.addEventListener("click", () => {
      const startText = startInput.value;
      const startPlace = selectedStartPlace;
      startInput.value = endInput.value;
      endInput.value = startText;
      selectedStartPlace = selectedEndPlace;
      selectedEndPlace = startPlace;
      lastStart = null;
      lastEnd = null;
      setWatchButtonVisible(false);
      resetRoutesHistory();
      hideSuggestions(startSuggestions);
      hideSuggestions(endSuggestions);
      statusEl.textContent = "시작점과 도착점의 입력 위치만 교환했습니다. RUN!을 누르면 새 경로를 탐색합니다.";
    });
    prevRouteBtn.addEventListener("click", showPreviousRoute);
    nextRouteBtn.addEventListener("click", showNextRoute);
    mapFullscreenBtn.addEventListener("click", () => setMapFullscreen(true));
    mapFullscreenCloseBtn.addEventListener("click", () => setMapFullscreen(false));
    window.addEventListener("resize", () => {
      if (mapFullscreenActive) refreshMapLayout();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && mapFullscreenActive) {
        setMapFullscreen(false);
      }
    });

    pickButtons.forEach((button) => {
      button.addEventListener("click", () => setPickMode(button.dataset.pickMode));
    });

    startInput.addEventListener("focus", () => setActiveLocationTarget("start"));
    startInput.addEventListener("click", () => setActiveLocationTarget("start"));
    endInput.addEventListener("focus", () => setActiveLocationTarget("end"));
    endInput.addEventListener("click", () => setActiveLocationTarget("end"));

    sharedCurrentLocationBtn.addEventListener("click", () => {
      startCurrentLocationTracking({ endpoint: activeLocationTarget, userInitiated: true });
    });
    sharedMapLocationBtn.addEventListener("click", () => {
      if (sharedMapLocationBtn.disabled) return;
      setPickMode(activeLocationTarget);
    });

    document.querySelectorAll("input[name='targetRange']").forEach((input) => {
      input.addEventListener("change", () => {
        setWatchButtonVisible(false);
        lastStart = null;
        lastEnd = null;
        resetRoutesHistory();
      });
    });

    function syncLoopDestination() {
      if (!loopRouteInput.checked) return;
      endInput.value = startInput.value;
      selectedEndPlace = selectedStartPlace;
      setWatchButtonVisible(false);
      lastStart = null;
      lastEnd = null;
      resetRoutesHistory();
    }

    startInput.addEventListener("input", syncLoopDestination);
    startInput.addEventListener("input", () => {
      setWatchButtonVisible(false);
      resetRoutesHistory();
    });
    endInput.addEventListener("input", () => {
      setWatchButtonVisible(false);
      resetRoutesHistory();
    });

    loopRouteInput.addEventListener("change", () => {
      setWatchButtonVisible(false);
      lastStart = null;
      lastEnd = null;
      resetRoutesHistory();
      if (loopRouteInput.checked) {
        endInput.value = startInput.value;
        selectedEndPlace = selectedStartPlace;
        mapBadgeEl.textContent = "루프 코스는 도착점에 시작점이 자동으로 들어가고, 출발지로 돌아옵니다.";
      }
    });

    attachPlaceAutocomplete(startInput, startSuggestions, "start");
    attachPlaceAutocomplete(endInput, endSuggestions, "end");

    sendWatchBtn.addEventListener("click", () => {
      trackAnalyticsEvent("watch_send_click", {
        button_text: "이 코스를 내 WATCH로 보내기"
      });
      alert("서비스 준비 중입니다");
    });

    currentLocationBtn.addEventListener("click", handleCurrentLocationButtonClick);
    window.addEventListener("beforeunload", () => {
      if (currentLocationWatchId !== null) navigator.geolocation.clearWatch(currentLocationWatchId);
    });

    loadRecentSearch();
    initMap();
    initializeBottomSheetDrag();
    setBottomSheetState("initial");
    startInput.value = "";
    endInput.value = "";
  </script>
</body>
</html>
