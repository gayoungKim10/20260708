<!DOCTYPE HTML>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STOPLESS</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FQM5TN868P"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-FQM5TN868P');
  </script>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=__KAKAO_JAVASCRIPT_KEY__&libraries=services"></script>
  <style>
    :root {
      --green: #39FF14;
      --green-dark: #1db954;
      --ink: #ffffff;
      --silver: #b3b3b3;
      --near-white: #fdfdfd;
      --bg: #121212;
      --surface: #181818;
      --surface-2: #1f1f1f;
      --surface-3: #252525;
      --border: #4d4d4d;
      --red: #f3727f;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: "Pretendard", "Segoe UI", -apple-system, Arial, sans-serif;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(340px, 420px) minmax(0, 1fr);
    }

    @media (min-width: 769px) {
      html.mac-desktop .app,
      html.windows-desktop .app {
        width: 111.111%;
        height: 111.111%;
        zoom: .9;
      }

      html.mac-desktop .result,
      html.windows-desktop .result {
        transform: translateX(40px);
      }
    }

    .panel {
      z-index: 10;
      padding: 28px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-y: auto;
    }

    h1 {
      margin: 0;
      color: var(--near-white);
      font-size: clamp(30px, 4vw, 40px);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .brand-title {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 1.25em;
      height: 1.25em;
      flex: 0 0 auto;
    }

    p {
      margin: 8px 0 0;
      color: var(--silver);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.43;
    }

    form {
      display: grid;
      gap: 14px;
    }

    .swap-places-row {
      display: flex;
      justify-content: center;
      margin-block: -8px;
    }

    .swap-places-button {
      width: 34px;
      min-height: 22px;
      padding: 0;
      color: var(--green);
      background: transparent;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
      transform: translateX(-34px);
    }

    .swap-places-button:hover {
      color: var(--green);
      background: var(--surface-2);
    }

    @media (min-width: 769px) {
      .swap-places-button {
        width: 34px;
        min-height: 18px;
      }
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--near-white);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.2;
    }

    input {
      width: 100%;
      min-height: 42px;
      border: 0;
      border-radius: 500px;
      padding: 0 12px;
      color: var(--ink);
      background: var(--surface-2);
      font: inherit;
      outline: none;
      transition: border-color .33s, box-shadow .25s;
    }

    input::placeholder { color: var(--silver); }

    input:focus {
      box-shadow: rgb(124, 124, 124) 0 0 0 1px inset;
    }

    .distance-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .distance-options input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .distance-options span {
      display: grid;
      min-height: 40px;
      place-items: center;
      border: 0;
      border-radius: 9999px;
      color: var(--silver);
      background: var(--surface-2);
      font-weight: 500;
      cursor: pointer;
      transition: border-color .33s, background-color .33s, color .33s;
    }

    .pick-label-short {
      display: none;
    }

    .distance-options input:checked + span {
      color: #000;
      background: var(--green);
    }

    .button-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(132px, .78fr);
      gap: 10px;
      align-items: center;
    }

    #makeRoute {
      min-height: 68px;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .route-control-stack {
      display: grid;
      gap: 8px;
    }

    #findNew {
      width: 100%;
      min-height: 44px;
      color: var(--ink);
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 13px;
      letter-spacing: 1px;
    }

    .history-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    #prevRoute,
    #nextRoute {
      width: 100%;
      min-height: 40px;
      padding: 0;
      border-radius: 9999px;
      font-size: 22px;
      line-height: 1;
      letter-spacing: 0;
      align-self: center;
    }

    #prevRoute:disabled,
    #nextRoute:disabled,
    #findNew:disabled {
      opacity: .38;
      cursor: not-allowed;
    }

    .watch-button {
      width: 100%;
      min-height: 44px;
      color: var(--ink);
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 13px;
      letter-spacing: 1.1px;
    }

    .watch-button[hidden] { display: none; }

    .recent-search {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--silver);
      font-size: 13px;
      line-height: 1.4;
    }

    .recent-search strong {
      flex: 0 0 auto;
      color: var(--near-white);
      font-size: 14px;
      font-weight: 500;
    }

    .recent-search-list {
      min-width: 0;
      display: flex;
      flex: 1 1 auto;
      flex-wrap: wrap;
      gap: 6px;
    }

    .recent-search-item {
      width: auto;
      min-height: 28px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 9999px;
      color: var(--silver);
      background: transparent;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: 0;
      text-align: left;
      text-transform: none;
    }

    .recent-search-item:hover {
      color: var(--ink);
      background: var(--surface-3);
    }

    @media (min-width: 769px) {
      .recent-search {
        min-height: 40px;
      }
    }

    button {
      min-height: 40px;
      border: 0;
      border-radius: 9999px;
      padding: 4px 16px;
      color: #000;
      background: var(--green);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      cursor: pointer;
      transition: border-color .33s, background-color .33s, color .33s, box-shadow .25s;
    }

    button:hover { background: var(--green-dark); }
    button:focus-visible { box-shadow: rgb(124,124,124) 0 0 0 1px inset; }
    button:disabled { opacity: .55; cursor: wait; }

    button.secondary {
      color: var(--ink);
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    button.secondary:hover {
      background: var(--surface-3);
    }

    .result {
      display: grid;
      gap: 14px;
      padding-top: 22px;
      border-top: 1px solid rgba(179, 179, 179, .18);
    }

    .status {
      min-height: 42px;
      color: var(--silver);
      font-size: 14px;
      line-height: 1.43;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      min-width: 0;
      padding: 12px 0;
      padding: 14px;
      border-radius: 8px;
      background: var(--surface);
      box-shadow: rgba(0,0,0,.3) 0 8px 8px;
    }

    .metric b {
      display: block;
      color: var(--near-white);
      font-size: 22px;
      font-weight: 500;
      line-height: 1.18;
    }

    .metric span {
      display: block;
      margin-top: 4px;
      color: var(--silver);
      font-size: 12px;
      line-height: 1.25;
    }

    .note {
      margin: 0;
      color: var(--silver);
      font-size: 13px;
      line-height: 1.5;
    }

    .map-area {
      position: relative;
      min-width: 0;
      min-height: 100%;
      background: var(--surface);
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-badge {
      position: absolute;
      z-index: 3;
      left: 18px;
      bottom: 18px;
      max-width: min(560px, calc(100% - 36px));
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--ink);
      background: rgba(24, 24, 24, .9);
      box-shadow: rgba(0,0,0,.5) 0 8px 24px;
      backdrop-filter: blur(10px);
      font-size: 13px;
      line-height: 1.45;
    }

    .current-location-button {
      position: absolute;
      z-index: 8;
      top: 18px;
      right: 18px;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 9999px;
      color: var(--ink);
      background: rgba(24, 24, 24, .92);
      box-shadow: rgba(0, 0, 0, .36) 0 6px 14px;
      font-size: 13px;
      letter-spacing: 0;
      text-transform: none;
      backdrop-filter: blur(10px);
    }

    .current-location-button:hover,
    .current-location-button.active {
      color: #000;
      background: var(--green);
    }

    .current-location-dot {
      width: 20px;
      height: 20px;
      border: 4px solid #fff;
      border-radius: 50%;
      background: #4285f4;
      box-shadow: 0 0 0 7px rgba(66, 133, 244, .24), rgba(0, 0, 0, .4) 0 3px 8px;
    }

    @media (min-width: 769px) {
      .current-location-button {
        position: fixed;
        z-index: 30;
        top: 18px;
        right: 18px;
      }

      .result {
        position: fixed;
        z-index: 12;
        top: 20px;
        left: calc(min(420px, max(340px, 25vw)) + 16px);
        width: min(392px, calc(100vw - min(420px, max(340px, 25vw)) - 32px));
        max-height: calc(100vh - 40px);
        padding: 16px 18px 18px;
        border: 0;
        border-radius: 16px;
        background: rgba(10, 10, 10, .94);
        box-shadow: rgba(0, 0, 0, .45) 0 14px 28px;
        backdrop-filter: blur(12px);
        overflow: auto;
      }

      .status {
        color: var(--near-white);
        font-size: 18px;
        line-height: 1.45;
      }

      .metric-grid {
        gap: 12px;
      }

      .metric {
        padding: 14px;
        background: #1a1a1a;
        box-shadow: rgba(0, 0, 0, .35) 0 10px 18px;
      }

      .metric b {
        color: var(--green);
        font-size: 34px;
        font-weight: 800;
        line-height: 1.05;
      }

      .metric span {
        margin-top: 6px;
        color: #cfcfcf;
        font-size: 14px;
      }

      .note {
        color: #c7c7c7;
        font-size: 14px;
      }
    }

    .map-fullscreen-toggle,
    .map-fullscreen-close {
      display: none;
    }

    .pin {
      width: 30px;
      height: 30px;
      border: 3px solid #fff;
      border-radius: 50% 50% 50% 0;
      background: var(--red);
      transform: rotate(-45deg);
    }

    .pin::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 9px;
      left: 8px;
      top: 8px;
      border-radius: 50%;
      background: #fff;
    }

    .route-arrow {
      position: relative;
      width: 14px;
      height: 14px;
      pointer-events: none;
      transform-origin: 50% 50%;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .22));
    }

    .route-arrow::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 2px;
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 9px solid rgba(255, 255, 255, .88);
    }

    @media (max-width: 520px) {
      .button-row,
      .distance-options { grid-template-columns: 1fr; }

      .metric-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
    }

    @media (max-width: 768px) {
      html,
      body {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
      }

      .app {
        height: auto;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      .panel {
        display: contents;
      }

      .panel > section {
        order: 0;
        padding: max(22px, env(safe-area-inset-top)) 22px 18px;
      }

      #routeForm {
        display: contents;
      }

      #routeForm > .place-field,
      #routeForm > .map-pick-row,
      #routeForm > .recent-search,
      #routeForm > label,
      #routeForm > .button-row,
      #routeForm > #sendWatch,
      .status,
      .metric-grid,
      .note {
        padding-inline: 22px;
      }

      #routeForm > label {
        gap: 10px;
      }

      #routeForm > .place-field,
      #routeForm > .map-pick-row,
      #routeForm > .recent-search,
      #routeForm > label:nth-of-type(4),
      #routeForm > .loop-toggle,
      #routeForm > .button-row,
      .status,
      .note {
        margin-bottom: 16px;
      }

      .result {
        gap: 18px;
      }

      #routeForm > .place-field:nth-of-type(1) { order: 1; }
      #routeForm > .swap-places-row { order: 2; margin: -10px 0 6px; }
      #routeForm > .place-field:nth-of-type(2) { order: 3; }
      #routeForm > .map-pick-row { display: none; }
      #routeForm > .loop-toggle { order: 4; }
      #routeForm > .recent-search { order: 5; }
      #routeForm > label:nth-of-type(4) { order: 6; }
      .result { display: contents; }
      .status { order: 7; padding-top: 6px; }

      .map-area {
        order: 8;
        width: 100%;
        min-height: 0;
        height: clamp(300px, 42vh, 400px);
        padding: 0 22px 22px;
      }

      .button-row {
        order: 9;
        grid-template-columns: 1fr;
        padding-inline: 22px;
      }

      .route-control-stack {
        grid-template-columns: minmax(0, 7fr) minmax(0, 3fr);
        gap: 8px;
        align-items: stretch;
      }

      .route-control-stack .history-nav {
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }

      .route-control-stack #prevRoute,
      .route-control-stack #nextRoute {
        min-height: 44px;
      }

      #sendWatch {
        order: 10;
        margin-inline: 22px;
      }

      .metric-grid {
        order: 11;
        grid-template-columns: 1fr;
      }

      .note {
        order: 12;
      }

      .place-input-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
      }

      .mobile-map-pick {
        display: inline-grid;
        min-height: 42px;
        padding-inline: 12px;
        place-items: center;
        white-space: normal;
        font-size: 12px;
        line-height: 1.2;
        letter-spacing: 0;
        text-transform: none;
      }

      .map-badge {
        left: 12px;
        right: 12px;
        bottom: 12px;
        max-width: none;
        font-size: 12px;
      }

      .distance-options {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
      }

      .distance-options label {
        min-width: 0;
      }

      .distance-options span {
        min-height: 36px;
        padding: 0 4px;
        font-size: 14px;
        white-space: nowrap;
      }

      .loop-toggle {
        width: calc(100% - 44px);
        max-width: calc(100% - 44px);
        box-sizing: border-box;
        align-self: center;
      }

      .map-pick-row {
        display: flex;
        gap: 8px;
      }

      .map-pick-row button {
        flex: 1 1 0;
        min-height: 44px;
        padding: 0 8px;
        font-size: 14px;
        white-space: nowrap;
      }

      .metric b {
        font-size: 24px;
      }

      #distance {
        color: var(--green);
        font-size: 34px;
        font-weight: 800;
      }

      #distance + span {
        color: var(--green);
      }

      .map-fullscreen-toggle {
        position: absolute;
        z-index: 8;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: rgba(24, 24, 24, .92);
        box-shadow: rgba(0, 0, 0, .36) 0 6px 14px;
        font-size: 18px;
        line-height: 1;
      }

      .map-fullscreen-close {
        display: none;
      }

      .map-fullscreen-toggle {
        left: 12px;
        top: 12px;
      }

      .current-location-button {
        top: 12px;
        right: 34px;
      }

      .map-fullscreen-close {
        left: 12px;
        top: 12px;
      }

      .map-area.is-fullscreen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        width: 100vw;
        height: 100dvh;
        padding: 12px;
        background: var(--bg);
      }

      .map-area.is-fullscreen #map {
        width: 100%;
        height: 100%;
      }

      .map-area.is-fullscreen .map-badge {
        left: 12px;
        right: 12px;
        bottom: 12px;
        max-width: none;
      }

      .map-area.is-fullscreen .map-fullscreen-toggle {
        display: none;
      }

      .map-area.is-fullscreen .map-fullscreen-close {
        display: grid;
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 1002;
      }

      .map-area.is-fullscreen .current-location-button {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 1002;
      }

      body.map-fullscreen-open {
        overflow: hidden;
      }

      #sendWatch {
        width: calc(100% - 44px);
        max-width: calc(100% - 44px);
        margin-inline: 22px;
        box-sizing: border-box;
        justify-self: stretch;
      }

      .pick-label-full {
        display: none;
      }

      .pick-label-short {
        display: inline;
      }
    }

    .map-pick-row { display: none; }

    .map-pick-row button {
      min-height: 36px;
      color: var(--silver);
      background: var(--surface-2);
      letter-spacing: .8px;
    }

    .map-pick-row button.active {
      color: #000;
      background: var(--green);
    }

    .loop-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 9999px;
      color: var(--silver);
      background: var(--surface-2);
      font-size: 14px;
      cursor: pointer;
    }

    .loop-toggle input {
      width: 18px;
      min-height: 18px;
      accent-color: var(--green);
    }

    .place-field {
      position: relative;
      color: var(--green);
    }

    .place-input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .mobile-map-pick {
      display: inline-grid;
      min-height: 42px;
      padding-inline: 12px;
      place-items: center;
      white-space: normal;
      font-size: 11px;
      line-height: 1.15;
    }

    .place-suggestions {
      position: absolute;
      z-index: 20;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      display: none;
      max-height: 220px;
      overflow-y: auto;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      box-shadow: rgba(0,0,0,.45) 0 12px 24px;
    }

    .place-suggestions.active {
      display: grid;
      gap: 4px;
    }

    .place-suggestion {
      width: 100%;
      min-height: 44px;
      display: grid;
      gap: 2px;
      padding: 8px 10px;
      border-radius: 6px;
      color: var(--ink);
      background: transparent;
      text-align: left;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 500;
    }

    .place-suggestion:hover {
      background: var(--surface-3);
    }

    .place-suggestion small {
      color: var(--silver);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.3;
    }

    @media (max-width: 768px) {
      .place-input-row { display: grid; }
      .mobile-map-pick { display: inline-grid; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel">
      <section>
        <h1 class="brand-title">
          <span>STOPLESS</span>
          <svg class="brand-logo" viewBox="0 0 96 96" role="img" aria-label="STOPLESS runner logo">
            <path d="M14 76c24 4 49-1 68-18" fill="none" stroke="#39FF14" stroke-width="5" stroke-linecap="round"/>
            <path d="M24 70c17 1 37-3 52-15" fill="none" stroke="#44e574" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 8"/>
            <path d="M78 40c4 0 7 3 7 7 0 6-7 12-7 12s-7-6-7-12c0-4 3-7 7-7z" fill="#2abf68"/>
            <circle cx="78" cy="47" r="2.6" fill="#121212"/>
            <circle cx="55" cy="18" r="8" fill="#137a49"/>
            <path d="M48 27l-9 15 14 8 9-15c3-5-8-14-14-8z" fill="#1fab63" stroke="#137a49" stroke-width="3" stroke-linejoin="round"/>
            <path d="M47 29c-7 3-13 8-19 15" fill="none" stroke="#1fab63" stroke-width="6" stroke-linecap="round"/>
            <path d="M29 43l-7 11" fill="none" stroke="#137a49" stroke-width="4" stroke-linecap="round"/>
            <path d="M57 31l12 10 8-11" fill="none" stroke="#1fab63" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M54 47l-13 16-19 8" fill="none" stroke="#137a49" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M50 50l14 11 8 16" fill="none" stroke="#39FF14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 72c0 9 8 11 16 8" fill="none" stroke="#44e574" stroke-width="5" stroke-linecap="round"/>
            <path d="M65 78c7 5 15 5 21 0" fill="none" stroke="#44e574" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </h1>
        <p>카카오맵의 도보 경로 데이터를 기준으로 목표 거리에 맞는 러닝 코스를 추천합니다.</p>
      </section>

      <form id="routeForm">
        <label class="place-field">
          시작점
          <span class="place-input-row">
            <input id="startInput" placeholder="예: 교대역, 양재역, 37.4937, 127.0142">
            <button class="secondary mobile-map-pick" type="button" data-pick-mode="start">지도에서<br>시작점 선택</button>
          </span>
          <div id="startSuggestions" class="place-suggestions"></div>
        </label>
        <div class="swap-places-row">
          <button id="swapPlaces" class="swap-places-button" type="button" aria-label="시작점과 도착점 교환" title="시작점과 도착점 교환">⇅</button>
        </div>
        <label class="place-field">
          도착점
          <span class="place-input-row">
            <input id="endInput" placeholder="예: 예술의전당, 양재천 카페거리">
            <button class="secondary mobile-map-pick" type="button" data-pick-mode="end">지도에서<br>도착점 선택</button>
          </span>
          <div id="endSuggestions" class="place-suggestions"></div>
        </label>
        <label class="loop-toggle">
          <input id="loopRoute" type="checkbox">
          출발지로 돌아오는 루프 코스
        </label>
        <div class="recent-search" aria-live="polite">
          <strong>최근 검색</strong>
          <div id="recentSearchList" class="recent-search-list"></div>
        </div>
        <div class="map-pick-row" aria-label="지도에서 위치 선택">
          <button id="pickStart" class="secondary" type="button" data-pick-mode="start">
            <span class="pick-label-full">지도에서 시작점 선택</span>
            <span class="pick-label-short">지도에서 시작 선택</span>
          </button>
          <button id="pickEnd" class="secondary" type="button" data-pick-mode="end">
            <span class="pick-label-full">지도에서 도착점 선택</span>
            <span class="pick-label-short">지도에서 도착 선택</span>
          </button>
        </div>
        <label>
          목표 거리
          <div class="distance-options">
            <label><input type="radio" name="targetRange" value="1-3"><span>1-3km</span></label>
            <label><input type="radio" name="targetRange" value="3-5"><span>3-5km</span></label>
            <label><input type="radio" name="targetRange" value="5-7" checked><span>5-7km</span></label>
            <label><input type="radio" name="targetRange" value="7-9"><span>7-9km</span></label>
            <label><input type="radio" name="targetRange" value="9-11"><span>9-11km</span></label>
          </div>
        </label>
        <div class="button-row">
          <button id="makeRoute" type="submit">RUN!</button>
          <div class="route-control-stack">
            <button id="findNew" class="secondary" type="button" aria-label="새 코스 찾기" title="새 코스 찾기">FIND NEW</button>
            <div class="history-nav" aria-label="저장된 코스 탐색">
              <button id="prevRoute" class="secondary" type="button" aria-label="이전 코스" title="이전 코스" disabled>‹</button>
              <button id="nextRoute" class="secondary" type="button" aria-label="다음 코스" title="다음 코스" disabled>›</button>
            </div>
          </div>
        </div>
        <button id="sendWatch" class="watch-button" type="button" hidden>이 코스를 내 WATCH로 보내기</button>
      </form>

      <section class="result">
        <div class="status" id="status">시작점과 도착점, 목표 거리를 선택하고 RUN!을 눌러 주세요.</div>
        <div class="metric-grid">
          <div class="metric"><b id="distance">-</b><span>실제 경로 거리</span></div>
          <div class="metric"><b id="crossings">-</b><span>횡단보도 수</span></div>
        </div>
        <p class="note">표시된 횡단 정보는 카카오 경로 안내 기준이며, 경로상의 모든 횡단보도와 신호를 포함하지 않을 수 있습니다.</p>
      </section>
    </aside>

    <main class="map-area">
      <div id="map"></div>
      <button id="currentLocationBtn" class="current-location-button" type="button" aria-label="현재 위치 표시">◎ 현재 위치</button>
      <button id="mapFullscreenBtn" class="map-fullscreen-toggle" type="button" aria-label="지도 전체화면" title="지도 전체화면">⛶</button>
      <button id="mapFullscreenCloseBtn" class="map-fullscreen-close" type="button" aria-label="전체화면 닫기" title="전체화면 닫기" hidden>X</button>
      <div class="map-badge" id="mapBadge">파란 선은 추천 러닝 코스입니다. 왕복 구간도 하나의 선으로 표시합니다.</div>
    </main>
  </div>

  <script>
    const isMacDesktop = /Macintosh|MacIntel/.test(navigator.userAgent)
      && (navigator.maxTouchPoints || 0) === 0;
    const isWindowsDesktop = /Windows NT/.test(navigator.userAgent);
    if (isMacDesktop) document.documentElement.classList.add("mac-desktop");
    if (isWindowsDesktop) document.documentElement.classList.add("windows-desktop");

    const KAKAO_READY = typeof kakao !== "undefined" && kakao.maps;
    const KAKAO_WALK_API_URL = "/api/kakao-walk";
    const KAKAO_PLACE_API_URL = "/api/kakao-place-search";
    const SEOUL_CENTER = { lat: 37.5665, lng: 126.9780 };
    const landmarks = {
      "교대역": [37.4937, 127.0142],
      "고속터미널역": [37.5049, 127.0049],
      "반포종합운동장": [37.4999, 126.9967],
      "예술의전당": [37.4803, 127.0115],
      "양재역": [37.4846, 127.0344],
      "양재천 카페거리": [37.4775, 127.0397],
      "강남역": [37.4979, 127.0276],
      "서초구청": [37.4836, 127.0327],
      "내방역": [37.4876, 126.9936],
      "사당역": [37.4766, 126.9816],
      "방배역": [37.4814, 126.9976],
      "남부터미널역": [37.4850, 127.0162],
      "서울고등학교": [37.4864, 127.0086],
      "경복궁역": [37.5758, 126.9736],
      "경복궁": [37.5796, 126.9770]
    };

    const statusEl = document.querySelector("#status");
    const distanceEl = document.querySelector("#distance");
    const crossingsEl = document.querySelector("#crossings");
    const mapBadgeEl = document.querySelector("#mapBadge");
    const mapArea = document.querySelector(".map-area");
    const mapFullscreenBtn = document.querySelector("#mapFullscreenBtn");
    const mapFullscreenCloseBtn = document.querySelector("#mapFullscreenCloseBtn");
    const currentLocationBtn = document.querySelector("#currentLocationBtn");
    const startInput = document.querySelector("#startInput");
    const endInput = document.querySelector("#endInput");
    const startSuggestions = document.querySelector("#startSuggestions");
    const endSuggestions = document.querySelector("#endSuggestions");
    const swapPlacesBtn = document.querySelector("#swapPlaces");
    const makeRouteBtn = document.querySelector("#makeRoute");
    const findNewBtn = document.querySelector("#findNew");
    const prevRouteBtn = document.querySelector("#prevRoute");
    const nextRouteBtn = document.querySelector("#nextRoute");
    const pickButtons = [...document.querySelectorAll("[data-pick-mode]")];
    const loopRouteInput = document.querySelector("#loopRoute");
    const sendWatchBtn = document.querySelector("#sendWatch");
    const recentSearchListEl = document.querySelector("#recentSearchList");
    const RECENT_SEARCH_STORAGE_KEY = "stopless.recent-route-search";
    let recentSearches = [];

    function restoreRecentSearch(entry) {
      startInput.value = entry.startLabel;
      endInput.value = entry.endLabel;
      loopRouteInput.checked = entry.startLabel === entry.endLabel;
      selectedStartPlace = null;
      selectedEndPlace = null;
      lastStart = null;
      lastEnd = null;
      setWatchButtonVisible(false);
      resetRoutesHistory();
      hideSuggestions(startSuggestions);
      hideSuggestions(endSuggestions);
    }

    function renderRecentSearch() {
      recentSearchListEl.replaceChildren();
      recentSearches.forEach((entry) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "recent-search-item";
        button.textContent = `${entry.startLabel}→${entry.endLabel}`;
        button.title = button.textContent;
        button.addEventListener("click", () => restoreRecentSearch(entry));
        recentSearchListEl.appendChild(button);
      });
    }

    function loadRecentSearch() {
      recentSearches = [];
      renderRecentSearch();
      try {
        localStorage.removeItem(RECENT_SEARCH_STORAGE_KEY);
      } catch (error) {
        console.warn("기존 최근 검색 저장값을 삭제하지 못했습니다.", error);
      }
    }

    function saveRecentSearch(start, end, useLoop) {
      const startLabel = startInput.value.trim() || start.label;
      const endLabel = useLoop ? startLabel : (endInput.value.trim() || end.label);
      const normalizeLabel = (label) => label.trim().replace(/\s+/g, " ").toLocaleLowerCase("ko-KR");
      const startKey = normalizeLabel(startLabel);
      const endKey = normalizeLabel(endLabel);
      recentSearches = recentSearches.filter((entry) => (
        normalizeLabel(entry.startLabel) !== startKey
        || normalizeLabel(entry.endLabel) !== endKey
      ));
      recentSearches.unshift({ startLabel, endLabel });
      renderRecentSearch();
    }

    let map;
    let geocoder;
    let places;
    let overlays = [];
    let draftStartOverlay = null;
    let draftEndOverlay = null;
    let polylines = [];
    let circles = [];
    let lastStart = null;
    let lastEnd = null;
    let pickMode = null;
    let routesHistory = [];
    let currentRouteIndex = -1;
    let routeCandidateState = null;
    let routeCandidateGeneration = 0;
    let shownRouteSignatures = new Set();
    let lastShownCrossingCount = -1;
    let mapFullscreenActive = false;
    let lastRouteBounds = null;
    let startSuggestTimer = null;
    let endSuggestTimer = null;
    const placeSearchCache = new Map();
    const placeSearchRequests = new Map();
    let selectedStartPlace = null;
    let selectedEndPlace = null;
    let currentLocationOverlay = null;
    let currentLocationWatchId = null;
    let currentLocationPoint = null;
    const ROUTE_CANDIDATE_BATCH_ATTEMPTS = 3;
    const INITIAL_ROUTE_CANDIDATE_LOOKAHEAD = 6;
    const ROUTE_MODES = ["BROAD_FIRST", "SHORTEST", "ACCESSIBLE"];

    function latLngToTm(lat, lng) {
      return {
        x: 200000 + (lng - 127) * 111000 * Math.cos(lat * Math.PI / 180),
        y: 600000 + (lat - 38) * 111000
      };
    }

    function initMap() {
      if (!KAKAO_READY) {
        statusEl.textContent = "카카오 지도 SDK를 불러오지 못했습니다. 카카오 앱 키의 JavaScript 플랫폼 도메인 설정을 확인해 주세요.";
        return;
      }
      map = new kakao.maps.Map(document.querySelector("#map"), {
        center: new kakao.maps.LatLng(SEOUL_CENTER.lat, SEOUL_CENTER.lng),
        level: 8
      });
      geocoder = new kakao.maps.services.Geocoder();
      places = new kakao.maps.services.Places();
      map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
      kakao.maps.event.addListener(map, "click", handleMapClick);
    }

    function showCurrentLocation(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      if (!Number.isFinite(lat) || !Number.isFinite(lng) || !map) return;
      const firstLocation = !currentLocationPoint;
      currentLocationPoint = { lat, lng };
      const mapPosition = new kakao.maps.LatLng(lat, lng);
      if (!currentLocationOverlay) {
        currentLocationOverlay = new kakao.maps.CustomOverlay({
          position: mapPosition,
          content: '<div class="current-location-dot" title="현재 위치"></div>',
          xAnchor: .5,
          yAnchor: .5,
          zIndex: 12
        });
        currentLocationOverlay.setMap(map);
      } else {
        currentLocationOverlay.setPosition(mapPosition);
      }
      currentLocationBtn.disabled = false;
      currentLocationBtn.classList.add("active");
      currentLocationBtn.textContent = "◎ 현재 위치";
      if (firstLocation) map.panTo(mapPosition);
    }

    function handleLocationError(error) {
      currentLocationBtn.disabled = false;
      currentLocationBtn.classList.remove("active");
      const messages = {
        1: "현재 위치 권한이 거부되었습니다. 브라우저 설정에서 위치 권한을 허용해 주세요.",
        2: "현재 위치를 확인할 수 없습니다.",
        3: "현재 위치 확인 시간이 초과되었습니다."
      };
      statusEl.textContent = messages[error.code] || "현재 위치를 확인하지 못했습니다.";
    }

    function startCurrentLocationTracking() {
      if (!navigator.geolocation) {
        statusEl.textContent = "이 브라우저에서는 현재 위치 기능을 지원하지 않습니다.";
        return;
      }
      if (currentLocationPoint) {
        map.panTo(new kakao.maps.LatLng(currentLocationPoint.lat, currentLocationPoint.lng));
      }
      if (currentLocationWatchId !== null) return;
      currentLocationBtn.disabled = true;
      currentLocationBtn.textContent = "위치 확인 중…";
      currentLocationWatchId = navigator.geolocation.watchPosition(
        showCurrentLocation,
        (error) => {
          currentLocationWatchId = null;
          handleLocationError(error);
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 12000 }
      );
    }

    function refreshMapLayout() {
      if (!map || typeof map.relayout !== "function") return;
      map.relayout();
      if (lastRouteBounds) {
        map.setBounds(lastRouteBounds, 56, 56, 56, 56);
      }
    }

    function setMapFullscreen(nextState) {
      if (!mapArea) return;
      const shouldOpen = typeof nextState === "boolean" ? nextState : !mapFullscreenActive;
      if (shouldOpen === mapFullscreenActive) return;
      mapFullscreenActive = shouldOpen;
      mapArea.classList.toggle("is-fullscreen", shouldOpen);
      document.body.classList.toggle("map-fullscreen-open", shouldOpen);
      mapFullscreenBtn.hidden = shouldOpen;
      mapFullscreenCloseBtn.hidden = !shouldOpen;
      requestAnimationFrame(() => {
        refreshMapLayout();
      });
    }

    function toLatLng(point) {
      return new kakao.maps.LatLng(point.lat, point.lng);
    }

    function clearMap() {
      polylines.forEach((line) => line.setMap(null));
      overlays.forEach((overlay) => overlay.setMap(null));
      circles.forEach((circle) => circle.setMap(null));
      polylines = [];
      overlays = [];
      circles = [];
    }

    function clearDraftPins() {
      if (draftStartOverlay) draftStartOverlay.setMap(null);
      if (draftEndOverlay) draftEndOverlay.setMap(null);
      draftStartOverlay = null;
      draftEndOverlay = null;
    }

    function setPickMode(mode) {
      pickMode = pickMode === mode ? null : mode;
      pickButtons.forEach((button) => button.classList.toggle("active", pickMode === button.dataset.pickMode));
      mapBadgeEl.textContent = pickMode
        ? `지도에서 ${pickMode === "start" ? "시작점" : "도착점"}을 클릭해 주세요.`
        : "파란 선은 추천 러닝 코스입니다. 왕복 구간도 하나의 선으로 표시합니다.";
    }

    function addDraftPin(point, title, mode) {
      if (mode === "start" && draftStartOverlay) draftStartOverlay.setMap(null);
      if (mode === "end" && draftEndOverlay) draftEndOverlay.setMap(null);
      const overlay = new kakao.maps.CustomOverlay({
        position: toLatLng(point),
        content: `<div class="pin" title="${title}"></div>`,
        yAnchor: 1
      });
      overlay.setMap(map);
      if (mode === "start") draftStartOverlay = overlay;
      if (mode === "end") draftEndOverlay = overlay;
    }

    function handleMapClick(event) {
      if (!pickMode) return;
      const lat = event.latLng.getLat();
      const lng = event.latLng.getLng();
      const value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
      const point = { lat, lng, ...latLngToTm(lat, lng) };
      if (pickMode === "start") {
        startInput.value = value;
        selectedStartPlace = null;
        syncLoopDestination();
        addDraftPin(point, "시작점", "start");
      } else {
        endInput.value = value;
        selectedEndPlace = null;
        addDraftPin(point, "도착점", "end");
      }
      setWatchButtonVisible(false);
      lastStart = null;
      lastEnd = null;
      setPickMode(null);
    }

    function parseCoordinate(text) {
      const match = text.trim().match(/(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/);
      if (!match) return null;
      const a = Number(match[1]);
      const b = Number(match[2]);
      if (Math.abs(a) <= 90 && Math.abs(b) <= 180) return { lat: a, lng: b, label: text.trim(), ...latLngToTm(a, b) };
      if (Math.abs(b) <= 90 && Math.abs(a) <= 180) return { lat: b, lng: a, label: text.trim(), ...latLngToTm(b, a) };
      return null;
    }

    function findLocalPlace(text) {
      const normalized = text.trim().replace(/\s/g, "");
      for (const [name, latLng] of Object.entries(landmarks)) {
        const key = name.replace(/\s/g, "");
        if (key === normalized) {
          const tm = latLngToTm(latLng[0], latLng[1]);
          return { label: name, lat: latLng[0], lng: latLng[1], ...tm };
        }
      }
      return null;
    }

    async function kakaoPlaceSearch(text) {
      const rows = await searchKakaoPlaces(text);
      if (!rows.length) throw new Error(`장소를 찾을 수 없습니다: ${text}`);
      const row = rows[0];
      const lat = Number(row.y);
      const lng = Number(row.x);
      return { label: row.place_name || text, lat, lng, ...latLngToTm(lat, lng) };
    }

    async function searchKakaoPlaces(text) {
      const query = text.trim();
      if (query.length < 2) return [];
      const cacheKey = query.toLocaleLowerCase("ko-KR");
      if (placeSearchCache.has(cacheKey)) return placeSearchCache.get(cacheKey);
      if (placeSearchRequests.has(cacheKey)) return placeSearchRequests.get(cacheKey);

      const request = fetch(`${KAKAO_PLACE_API_URL}?query=${encodeURIComponent(query)}`)
        .then(async (response) => {
          if (!response.ok) return [];
          const data = await response.json();
          const rows = (data.documents || []).slice(0, 10);
          placeSearchCache.set(cacheKey, rows);
          return rows;
        })
        .finally(() => placeSearchRequests.delete(cacheKey));
      placeSearchRequests.set(cacheKey, request);
      return request;
    }

    function hideSuggestions(container) {
      container.classList.remove("active");
      container.innerHTML = "";
    }

    function renderPlaceSuggestions(input, container, rows) {
      container.innerHTML = "";
      if (!rows.length) {
        hideSuggestions(container);
        return;
      }

      rows.forEach((row) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "place-suggestion";
        const name = document.createElement("span");
        const address = document.createElement("small");
        name.textContent = row.place_name;
        address.textContent = row.road_address_name || row.address_name || "";
        button.append(name, address);
        button.addEventListener("click", () => {
          const selected = {
            label: row.place_name,
            lat: Number(row.y),
            lng: Number(row.x),
            ...latLngToTm(Number(row.y), Number(row.x))
          };
          input.value = row.place_name;
          if (input === startInput) {
            selectedStartPlace = selected;
            if (loopRouteInput.checked) selectedEndPlace = selected;
            syncLoopDestination();
          } else {
            selectedEndPlace = selected;
          }
          hideSuggestions(container);
          setWatchButtonVisible(false);
          lastStart = null;
          lastEnd = null;
          resetRoutesHistory();
          map.panTo(toLatLng(selected));
        });
        container.appendChild(button);
      });

      container.classList.add("active");
    }

    function attachPlaceAutocomplete(input, container, timerName) {
      input.addEventListener("input", () => {
        if (timerName === "start") {
          selectedStartPlace = null;
          if (loopRouteInput.checked) selectedEndPlace = null;
        } else {
          selectedEndPlace = null;
        }
        clearTimeout(timerName === "start" ? startSuggestTimer : endSuggestTimer);
        const run = async () => {
          const query = input.value.trim();
          const rows = await searchKakaoPlaces(query);
          if (input.value.trim() !== query) return;
          renderPlaceSuggestions(input, container, rows);
        };

        if (timerName === "start") {
          startSuggestTimer = setTimeout(run, 60);
        } else {
          endSuggestTimer = setTimeout(run, 60);
        }
      });

      input.addEventListener("blur", () => {
        setTimeout(() => hideSuggestions(container), 160);
      });
    }

    async function geocode(text) {
      const coord = parseCoordinate(text);
      if (coord) return coord;
      const local = findLocalPlace(text);
      if (local) return local;
      return kakaoPlaceSearch(text);
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function latLngToRoutePoint(lat, lng) {
      return { lat, lng, ...latLngToTm(lat, lng) };
    }

    function localPointToLatLng(point) {
      if (Number.isFinite(point.lat) && Number.isFinite(point.lng)) return [point.lat, point.lng];
      const lat = 38 + ((point.y - 600000) / 111000);
      const lng = 127 + ((point.x - 200000) / (111000 * Math.cos(lat * Math.PI / 180)));
      return [lat, lng];
    }

    function buildLoopWaypointSets(start, targetMeters, generation = 0) {
      const radius = Math.min(
        Math.max(targetMeters / (Math.PI * 2) * 1.02, Math.max(160, targetMeters * .11)),
        1700
      );
      const basePatterns = [
        [0, 90, 180, 270],
        [45, 135, 225, 315],
        [0, 72, 144, 216, 288],
        [36, 108, 180, 252, 324],
        [-90, -15, 15, 90],
        [90, 165, 195, 270],
        [0, 120, 240],
        [60, 180, 300]
      ];
      const rotations = [0, 18, 36, 54, 72, 90, 126, 162];
      const scales = [.72, .86, 1, 1.14, 1.3];
      const sets = [];
      const phase = (generation * 13) % 360;

      rotations.forEach((rotation, rotationIndex) => {
        basePatterns.forEach((pattern, patternIndex) => {
          const scale = scales[(rotationIndex + patternIndex + generation) % scales.length];
          const stretch = patternIndex % 2 ? 1.18 : .88;
          const points = pattern.map((deg, pointIndex) => {
            const wobble = pointIndex % 2 ? 12 : -8;
            const rad = (deg + rotation + wobble + phase) * Math.PI / 180;
            return {
              x: start.x + Math.cos(rad) * radius * scale * stretch,
              y: start.y + Math.sin(rad) * radius * scale / stretch
            };
          });
          sets.push([start, ...points, start]);
        });
      });

      return sets;
    }

    function buildWaypointSets(start, end, targetMeters, generation = 0) {
      if (distance(start, end) < 80) return buildLoopWaypointSets(start, targetMeters, generation);
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const direct = Math.max(distance(start, end), 1);
      const nx = -dy / direct;
      const ny = dx / direct;
      const tx = dx / direct;
      const ty = dy / direct;
      const detour = Math.max(targetMeters - direct, targetMeters * .24);
      const side = Math.min(
        Math.max(detour / 3.2, Math.max(180, targetMeters * .14)),
        targetMeters * .42
      );
      const forward = Math.min(
        Math.max(targetMeters / 7.5, Math.max(140, targetMeters * .1)),
        targetMeters * .28
      );
      const center = { x: (start.x + end.x) / 2, y: (start.y + end.y) / 2 };
      const sideFactors = [1, -1, 1.28, -1.28, .7, -.7, 1.55, -1.55, .42, -.42, 1.9, -1.9, .25, -.25, 2.15, -2.15];
      const pushFactors = [.34, -.34, .12, -.12, .56, -.56, .74, -.74];
      // 첫 탐색은 기존에 검증된 후보 형상을 그대로 사용한다. 후보가
      // 소진된 다음 세대부터만 방향과 굴곡을 조금씩 바꾼다.
      const spreadScale = generation === 0 ? 1 : .88 + (generation % 7) * .045;
      const pushOffset = generation === 0 ? 0 : ((generation % 9) - 4) * .025;

      return sideFactors.flatMap((sign, index) => {
        const spread = side * sign * spreadScale;
        return pushFactors.slice(0, index < 4 ? 5 : 3).map((pushFactor, pushIndex) => {
          const push = forward * (pushFactor + pushOffset);
          const bend = (pushIndex % 2 ? -.22 : .22) * side;
          const a = { x: center.x - tx * forward + nx * spread + tx * push, y: center.y - ty * forward + ny * spread + ty * push };
          const b = { x: center.x + tx * forward + nx * spread * .9 - tx * push, y: center.y + ty * forward + ny * spread * .9 - ty * push };
          const c = { x: center.x + nx * (spread * .32 + bend) - tx * forward * .16, y: center.y + ny * (spread * .32 + bend) - ty * forward * .16 };
          return index < 2 ? [start, a, b, end] : [start, a, c, b, end];
        });
      });
    }

    async function fetchPedestrianRoute(points, routeMode = "BROAD_FIRST") {
      const coordinates = points.map(localPointToLatLng).map(([lat, lng]) => ({ lat, lng }));
      const response = await fetch(KAKAO_WALK_API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ points: coordinates, routeMode })
      });
      if (!response.ok) {
        const errorBody = await response.json().catch(() => ({}));
        const error = new Error(errorBody.message || "카카오 도보 경로 API 응답이 없습니다.");
        error.code = errorBody.code;
        error.showAlert = errorBody.code === -10 || /limit|한도/i.test(error.message);
        throw error;
      }
      const data = await response.json();
      if (data.status !== "OK" || !data.route) {
        throw new Error(`카카오 도보 경로를 찾지 못했습니다. (${data.status || "UNKNOWN"})`);
      }

      const steps = (data.route.legs || []).flatMap((leg) => leg.steps || []);
      const latLngs = [];
      steps.forEach((step) => {
        (step.path?.points || []).forEach(([lng, lat]) => {
          const previous = latLngs[latLngs.length - 1];
          if (!previous || previous[0] !== lat || previous[1] !== lng) latLngs.push([lat, lng]);
        });
      });
      if (latLngs.length < 2) throw new Error("카카오 경로 좌표가 비어 있습니다.");

      const tmPoints = latLngs.map(([lat, lng]) => latLngToRoutePoint(lat, lng));
      const pedestrianGuides = steps.map((step) => ({
        guidance: step.properties?.guidance || "",
        distance: step.properties?.distance || 0,
        time: step.properties?.time || 0,
        lat: step.properties?.y,
        lng: step.properties?.x
      })).filter((step) => step.guidance);
      const crossingGuides = pedestrianGuides.filter((step) => /횡단보도/.test(step.guidance));
      const facilityGuides = pedestrianGuides.filter((step) => /육교|지하도|계단|경사로|엘리베이터|역사 내|보행자/.test(step.guidance));

      return {
        latLngs,
        tmPoints,
        meters: data.route.properties?.totalDistance,
        seconds: data.route.properties?.totalTime,
        landingUrl: data.route.properties?.landingUrl,
        pedestrianGuides,
        crossingGuides,
        facilityGuides,
        crossed: crossingGuides.length,
        routeMode,
        source: "kakao-walk"
      };
    }

    function routeCandidateKey(start, end, targetRange) {
      return [
        start.lat.toFixed(5),
        start.lng.toFixed(5),
        end.lat.toFixed(5),
        end.lng.toFixed(5),
        targetRange.min,
        targetRange.max
      ].join("|");
    }

    function ensureRouteCandidateState(start, end, targetRange) {
      const cacheKey = routeCandidateKey(start, end, targetRange);
      if (!routeCandidateState || routeCandidateState.key !== cacheKey) {
        const targetMeters = (targetRange.min + targetRange.max) / 2;
        const generation = routeCandidateGeneration++;
        const routeMode = ROUTE_MODES[Math.min(generation, ROUTE_MODES.length - 1)];
        routeCandidateState = {
          key: cacheKey,
          generation,
          routeMode,
          waypointSets: buildWaypointSets(start, end, targetMeters, generation),
          nextIndex: 0,
          shownRouteSignatures,
          candidateSignatures: new Set(),
          rankedCandidates: []
        };
      }
      return routeCandidateState;
    }

    function routeTargetDelta(route, targetRange) {
      const targetMeters = (targetRange.min + targetRange.max) / 2;
      return Math.abs(route.meters - targetMeters);
    }

    function compareRouteCandidates(a, b, targetRange) {
      return Number(!a.insideTargetRange) - Number(!b.insideTargetRange)
        || a.crossed - b.crossed
        || routeTargetDelta(a, targetRange) - routeTargetDelta(b, targetRange)
        || a.meters - b.meters;
    }

    function isRouteInsideRecommendationRange(route, targetRange) {
      return route.meters >= targetRange.min * .8 && route.meters <= targetRange.max * 1.2;
    }

    async function collectRouteCandidates(state, targetRange) {
      const waypoints = [];

      while (
        state.waypointSets.length
        && state.nextIndex < state.waypointSets.length
        && waypoints.length < ROUTE_CANDIDATE_BATCH_ATTEMPTS
      ) {
        waypoints.push(state.waypointSets[state.nextIndex]);
        state.nextIndex += 1;
      }

      const results = await Promise.allSettled(
        waypoints.map((waypoint) => fetchPedestrianRoute(waypoint, state.routeMode))
      );
      let collected = 0;
      let fulfilled = 0;
      let firstError = null;

      results.forEach((result) => {
        if (result.status !== 'fulfilled') {
          firstError ||= result.reason;
          console.warn(result.reason);
          return;
        }

        fulfilled += 1;
        const candidate = result.value;
        if (!isRouteInsideRecommendationRange(candidate, targetRange)) return;
        candidate.insideTargetRange = isRouteInsideTargetRange(candidate, targetRange);

        const signature = routeSignature(candidate);
        if (state.candidateSignatures.has(signature)) return;

        state.candidateSignatures.add(signature);
        state.rankedCandidates.push(candidate);
        collected += 1;
      });

      if (waypoints.length && fulfilled === 0 && firstError) throw firstError;

      state.rankedCandidates.sort((a, b) => compareRouteCandidates(a, b, targetRange));
      console.info('[Route candidates] ranked pool', {
        attempted: waypoints.length,
        routeMode: state.routeMode,
        collected,
        totalRanked: state.rankedCandidates.length,
        nextIndex: state.nextIndex,
        remainingWaypoints: Math.max(0, state.waypointSets.length - state.nextIndex),
        rankedPreview: state.rankedCandidates.slice(0, 8).map((route) => ({
          distanceMeters: Math.round(route.meters),
          kakaoGuidedCrossings: route.crossed
        }))
      });
    }
    function nextRankedRouteCandidate(state) {
      const requireExactRange = state.nextIndex < state.waypointSets.length;
      return state.rankedCandidates.find((candidate) => {
        const signature = routeSignature(candidate);
        return !state.shownRouteSignatures.has(signature)
          && candidate.crossed >= lastShownCrossingCount
          && (!requireExactRange || candidate.insideTargetRange);
      }) || null;
    }

    async function choosePedestrianRoute(start, end, targetRange) {
      const state = ensureRouteCandidateState(start, end, targetRange);

      if (!state.rankedCandidates.length) {
        const lookahead = state.generation === 0
          ? INITIAL_ROUTE_CANDIDATE_LOOKAHEAD
          : ROUTE_CANDIDATE_BATCH_ATTEMPTS;
        while (
          state.nextIndex < state.waypointSets.length
          && state.nextIndex < lookahead
        ) {
          await collectRouteCandidates(state, targetRange);
        }
      }

      while (state.nextIndex < state.waypointSets.length || nextRankedRouteCandidate(state)) {
        let candidate = nextRankedRouteCandidate(state);
        if (!candidate) {
          await collectRouteCandidates(state, targetRange);
          candidate = nextRankedRouteCandidate(state);
        }
        if (!candidate) {
          if (state.nextIndex < state.waypointSets.length) continue;
          break;
        }

        const signature = routeSignature(candidate);
        state.shownRouteSignatures.add(signature);
        lastShownCrossingCount = candidate.crossed;
        return candidate;
      }

      return null;
    }
    function isRouteInsideTargetRange(route, targetRange) {
      return route.meters >= targetRange.min && route.meters <= targetRange.max;
    }

    function routeSignature(route) {
      const points = route.tmPoints || [];
      if (!points.length) {
        return `${Math.round(route.meters / 10)}|empty`;
      }
      const indexes = [
        0,
        Math.floor(points.length / 4),
        Math.floor(points.length / 2),
        Math.floor(points.length * 3 / 4),
        points.length - 1
      ];
      const sampled = indexes.map((index) => {
        const point = points[Math.min(points.length - 1, Math.max(0, index))];
        return `${Math.round(point.x / 3)},${Math.round(point.y / 3)}`;
      });
      return [Math.round(route.meters / 10), ...sampled].join("|");
    }

    function parseTargetRange() {
      const value = document.querySelector("input[name='targetRange']:checked").value;
      const [minKm, maxKm] = value.split("-").map(Number);
      return { min: minKm * 1000, max: maxKm * 1000, label: value };
    }

    function formatKmRange(range) {
      return `${Math.round(range.min / 1000)}-${Math.round(range.max / 1000)}km`;
    }

    function trackAnalyticsEvent(eventName, params = {}) {
      if (typeof gtag !== "function") return;
      gtag("event", eventName, {
        app_name: "STOPLESS",
        ...params
      });
    }

    function setWatchButtonVisible(isVisible) {
      sendWatchBtn.hidden = !isVisible;
    }

    function addRouteArrows(path) {
      if (!path.length) return;
      const tmPath = path.map((point) => ({
        lat: point.getLat(),
        lng: point.getLng(),
        ...latLngToTm(point.getLat(), point.getLng())
      }));
      const segmentLengths = [];
      let totalLength = 0;

      for (let i = 0; i < tmPath.length - 1; i += 1) {
        const length = distance(tmPath[i], tmPath[i + 1]);
        segmentLengths.push(length);
        totalLength += length;
      }

      if (totalLength < 120) return;

      const spacing = Math.max(70, Math.min(130, totalLength / 26));
      for (let target = spacing; target < totalLength - spacing * .45; target += spacing) {
        let walked = 0;
        for (let i = 0; i < segmentLengths.length; i += 1) {
          const segmentLength = segmentLengths[i];
          if (walked + segmentLength < target || segmentLength < 1) {
            walked += segmentLength;
            continue;
          }

          const from = tmPath[i];
          const to = tmPath[i + 1];
          const ratio = (target - walked) / segmentLength;
          const x = from.x + (to.x - from.x) * ratio;
          const y = from.y + (to.y - from.y) * ratio;
          const [lat, lng] = localPointToLatLng({ x, y });
          const angle = Math.atan2(to.x - from.x, to.y - from.y) * 180 / Math.PI;
          const overlay = new kakao.maps.CustomOverlay({
            position: new kakao.maps.LatLng(lat, lng),
            content: `<div class="route-arrow" style="transform: rotate(${angle}deg)"></div>`,
            xAnchor: .5,
            yAnchor: .5,
            zIndex: 4
          });
          overlay.setMap(map);
          overlays.push(overlay);
          break;
        }
      }
    }

    function drawBlueRoute(path, weight = 8) {
      const casing = new kakao.maps.Polyline({
        path,
        strokeWeight: weight + 7,
        strokeColor: "#FFFFFF",
        strokeOpacity: .94,
        strokeStyle: "solid"
      });
      const line = new kakao.maps.Polyline({
        path,
        strokeWeight: weight,
        strokeColor: "#3E6AE1",
        strokeOpacity: .98,
        strokeStyle: "solid"
      });
      casing.setMap(map);
      line.setMap(map);
      polylines.push(casing, line);
      addRouteArrows(path);
      return line;
    }

    function addPin(point, title) {
      const overlay = new kakao.maps.CustomOverlay({
        position: toLatLng(point),
        content: `<div class="pin" title="${title}"></div>`,
        yAnchor: 1
      });
      overlay.setMap(map);
      overlays.push(overlay);
    }

    function drawCrossings(crossings) {
      crossings.forEach((p) => {
        const circle = new kakao.maps.Circle({
          center: toLatLng(p),
          radius: 7,
          strokeWeight: 1,
          strokeColor: "#D92027",
          strokeOpacity: .72,
          fillColor: "#D92027",
          fillOpacity: .58
        });
        circle.setMap(map);
        circles.push(circle);
      });
    }

    function drawRoute(start, end, route, targetRange) {
      clearMap();
      clearDraftPins();
      const path = route.latLngs.map(([lat, lng]) => new kakao.maps.LatLng(lat, lng));
      drawBlueRoute(path, 8);

      drawCrossings(route.crossingGuides.filter((guide) => Number.isFinite(guide.lat) && Number.isFinite(guide.lng)));
      addPin(start, "시작점");
      addPin(end, "도착점");

      const bounds = new kakao.maps.LatLngBounds();
      path.forEach((point) => bounds.extend(point));
      bounds.extend(toLatLng(start));
      bounds.extend(toLatLng(end));
      lastRouteBounds = bounds;
      map.setBounds(bounds, 56, 56, 56, 56);

      const km = route.meters / 1000;
      const routeModeLabel = {
        BROAD_FIRST: "큰길 우선",
        SHORTEST: "최단 경로",
        ACCESSIBLE: "접근성 우선"
      }[route.routeMode] || "보행 경로";
      distanceEl.textContent = `${km.toFixed(2)} km`;
      crossingsEl.textContent = `${route.crossed}개`;
      statusEl.textContent = route.insideTargetRange
        ? `${formatKmRange(targetRange)} 조건에 맞는 카카오 ${routeModeLabel} 보행 경로를 선택했습니다. FIND NEW는 다음 후보를 보여줍니다.`
        : `${formatKmRange(targetRange)}에 가장 가까운 카카오 ${routeModeLabel} 보행 경로를 선택했습니다. FIND NEW는 횡단보도 수와 관계없이 다음 후보를 보여줍니다.`;
      const facilitySummary = route.facilityGuides.length ? ` 기타 보행 안내 ${route.facilityGuides.length}건도 반영했습니다.` : "";
      mapBadgeEl.textContent = `파란 선은 카카오 도보 경로입니다. 빨간 점 ${route.crossed}개는 안내 문구에 명시된 횡단 지점이며 전수 데이터는 아닙니다.${facilitySummary}`;
      setWatchButtonVisible(true);
    }

    function updateRouteNavButtons() {
      prevRouteBtn.disabled = currentRouteIndex <= 0;
      nextRouteBtn.disabled = currentRouteIndex < 0 || currentRouteIndex >= routesHistory.length - 1;
    }

    function resetRoutesHistory() {
      routesHistory = [];
      currentRouteIndex = -1;
      routeCandidateState = null;
      routeCandidateGeneration = 0;
      shownRouteSignatures = new Set();
      lastShownCrossingCount = -1;
      updateRouteNavButtons();
    }

    function appendRouteToHistory(start, end, route, targetRange) {
      routesHistory.push({ start, end, route, targetRange });
      currentRouteIndex = routesHistory.length - 1;
      updateRouteNavButtons();
    }

    function showStoredRoute(index) {
      if (index < 0 || index >= routesHistory.length) return;
      currentRouteIndex = index;
      const entry = routesHistory[currentRouteIndex];
      drawRoute(entry.start, entry.end, entry.route, entry.targetRange);
      updateRouteNavButtons();
    }

    function showPreviousRoute() {
      showStoredRoute(currentRouteIndex - 1);
    }

    function showNextRoute() {
      showStoredRoute(currentRouteIndex + 1);
    }

    async function ensureRouteEndpoints(targetRange, useLoop, startText, endText) {
      lastStart = selectedStartPlace && selectedStartPlace.label === startText
        ? selectedStartPlace
        : await geocode(startText);
      lastEnd = useLoop
        ? { ...lastStart, label: `${lastStart.label} 루프` }
        : selectedEndPlace && selectedEndPlace.label === endText
          ? selectedEndPlace
          : await geocode(endText);

      if (!useLoop && distance(lastStart, lastEnd) > targetRange.max) {
        const error = new Error(`시작점과 도착점 사이의 직선거리가 ${formatKmRange(targetRange)}의 최대 거리보다 깁니다. 목표 거리를 늘리거나 시작/도착점을 다시 선택해 주세요.`);
        error.showAlert = true;
        throw error;
      }
    }

    async function createAndStoreRoute({ reset = false } = {}) {
      const startText = startInput.value.trim();
      const endText = endInput.value.trim();
      const targetRange = parseTargetRange();
      const useLoop = loopRouteInput.checked || !endText;
      if (!startText || (!useLoop && !endText)) {
        setWatchButtonVisible(false);
        statusEl.textContent = "시작점을 입력해 주세요. 루프가 아니라면 도착점도 필요합니다.";
        return;
      }
      if (!KAKAO_READY) return;

      setWatchButtonVisible(false);
      makeRouteBtn.disabled = true;
      findNewBtn.disabled = true;
      prevRouteBtn.disabled = true;
      nextRouteBtn.disabled = true;
      statusEl.textContent = reset
        ? `${formatKmRange(targetRange)} 범위 안에서 첫 추천 코스를 찾고 있습니다.`
        : `${formatKmRange(targetRange)} 조건에서 새 추천 코스를 하나 찾고 있습니다.`;

      try {
        if (reset || !lastStart || !lastEnd) {
          resetRoutesHistory();
          await ensureRouteEndpoints(targetRange, useLoop, startText, endText);
          if (reset) saveRecentSearch(lastStart, lastEnd, useLoop);
        }

        let route = await choosePedestrianRoute(lastStart, lastEnd, targetRange);
        if (!route) {
          routeCandidateState = null;
          statusEl.textContent = "기존 후보를 모두 확인해 다른 방향의 카카오 보행 경로를 찾고 있습니다.";
          route = await choosePedestrianRoute(lastStart, lastEnd, targetRange);
        }
        if (!route) {
          routeCandidateState = null;
          alert("현재 조건에서 새 추천 경로를 찾지 못했습니다. 다시 시도하면 다른 방향으로 계속 탐색합니다.");
          statusEl.textContent = `${formatKmRange(targetRange)} 범위의 새 경로를 찾지 못했습니다. FIND NEW를 누르면 다른 방향 후보를 계속 탐색합니다.`;
          return;
        }

        appendRouteToHistory(lastStart, lastEnd, route, targetRange);
        drawRoute(lastStart, lastEnd, route, targetRange);
      } catch (error) {
        setWatchButtonVisible(false);
        statusEl.textContent = error.message || "코스를 계산하지 못했습니다.";
        if (error.showAlert) alert(error.message);
      } finally {
        makeRouteBtn.disabled = false;
        findNewBtn.disabled = false;
        updateRouteNavButtons();
      }
    }
    document.querySelector("#routeForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const targetRange = parseTargetRange();
      trackAnalyticsEvent("run_click", {
        button_text: "RUN!",
        target_range: formatKmRange(targetRange),
        loop_route: loopRouteInput.checked ? "yes" : "no"
      });
      createAndStoreRoute({ reset: true });
    });

    findNewBtn.addEventListener("click", () => createAndStoreRoute({ reset: false }));
    swapPlacesBtn.addEventListener("click", () => {
      const startText = startInput.value;
      const startPlace = selectedStartPlace;
      startInput.value = endInput.value;
      endInput.value = startText;
      selectedStartPlace = selectedEndPlace;
      selectedEndPlace = startPlace;
      lastStart = null;
      lastEnd = null;
      setWatchButtonVisible(false);
      resetRoutesHistory();
      hideSuggestions(startSuggestions);
      hideSuggestions(endSuggestions);
      statusEl.textContent = "시작점과 도착점의 입력 위치만 교환했습니다. RUN!을 누르면 새 경로를 탐색합니다.";
    });
    prevRouteBtn.addEventListener("click", showPreviousRoute);
    nextRouteBtn.addEventListener("click", showNextRoute);
    mapFullscreenBtn.addEventListener("click", () => setMapFullscreen(true));
    mapFullscreenCloseBtn.addEventListener("click", () => setMapFullscreen(false));
    window.addEventListener("resize", () => {
      if (mapFullscreenActive) refreshMapLayout();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && mapFullscreenActive) {
        setMapFullscreen(false);
      }
    });

    pickButtons.forEach((button) => {
      button.addEventListener("click", () => setPickMode(button.dataset.pickMode));
    });

    document.querySelectorAll("input[name='targetRange']").forEach((input) => {
      input.addEventListener("change", () => {
        setWatchButtonVisible(false);
        lastStart = null;
        lastEnd = null;
        resetRoutesHistory();
      });
    });

    function syncLoopDestination() {
      if (!loopRouteInput.checked) return;
      endInput.value = startInput.value;
      selectedEndPlace = selectedStartPlace;
      setWatchButtonVisible(false);
      lastStart = null;
      lastEnd = null;
      resetRoutesHistory();
    }

    startInput.addEventListener("input", syncLoopDestination);
    startInput.addEventListener("input", () => {
      setWatchButtonVisible(false);
      resetRoutesHistory();
    });
    endInput.addEventListener("input", () => {
      setWatchButtonVisible(false);
      resetRoutesHistory();
    });

    loopRouteInput.addEventListener("change", () => {
      setWatchButtonVisible(false);
      lastStart = null;
      lastEnd = null;
      resetRoutesHistory();
      if (loopRouteInput.checked) {
        endInput.value = startInput.value;
        selectedEndPlace = selectedStartPlace;
        mapBadgeEl.textContent = "루프 코스는 도착점에 시작점이 자동으로 들어가고, 출발지로 돌아옵니다.";
      }
    });

    attachPlaceAutocomplete(startInput, startSuggestions, "start");
    attachPlaceAutocomplete(endInput, endSuggestions, "end");

    sendWatchBtn.addEventListener("click", () => {
      trackAnalyticsEvent("watch_send_click", {
        button_text: "이 코스를 내 WATCH로 보내기"
      });
      alert("서비스 준비 중입니다");
    });

    currentLocationBtn.addEventListener("click", startCurrentLocationTracking);
    window.addEventListener("beforeunload", () => {
      if (currentLocationWatchId !== null) navigator.geolocation.clearWatch(currentLocationWatchId);
    });

    loadRecentSearch();
    initMap();
    startInput.value = "교대역";
    endInput.value = "예술의전당";
  </script>
</body>
</html>
